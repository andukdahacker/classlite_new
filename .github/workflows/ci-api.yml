name: CI — API

on:
  push:
    paths: ['classlite-api/**']
  pull_request:
    paths: ['classlite-api/**']

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: classlite_test
          POSTGRES_USER: classlite
          POSTGRES_PASSWORD: test
        ports:
          - '5432:5432'
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Install ffmpeg (Story 6.3b0 — audio transcode integration tests)
        # The internal/media FFmpegTranscoder tests are INTEGRATION tests against
        # a real ffmpeg (webm/mp4 → Opus/Ogg). Install it explicitly rather than
        # relying on the runner image so the tests always RUN (AC7: no silent
        # green). ffprobe ships in the same apt package and is used by the AC2
        # structural assertion.
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Lint (golangci-lint)
        # Runs the standard-linter set defined in classlite-api/.golangci.yml
        # (errcheck / govet / staticcheck / unused / ineffassign). Replaces the
        # prior standalone `go vet` + `staticcheck` steps — same underlying
        # tools, one binary, one AST walk.
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: classlite-api
      - name: Tenantcheck (R1 mitigation A — GO-1 enforcement)
        # Custom analyzer that fails the build if any method on a *Store type
        # is missing TenantContext as its second parameter. Runs standalone
        # (not through golangci-lint custom binary) so violations point
        # unambiguously to project-context.md GO-1. See
        # _bmad-output/test-artifacts/test-design/pre-epic-2-blockers-2026-06-30.md
        # and tools/tenantcheck/ for the mechanism.
        #
        # Two calls: (a) run the analyzer's own tests — asserts the negative
        # fixtures still fire diagnostics (teeth check); (b) run the analyzer
        # against the real store package.
        run: |
          cd classlite-api
          go test ./tools/tenantcheck/...
          go run ./tools/tenantcheck/cmd/tenantcheck ./internal/store/...
      - name: sqlc vet
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
          cd classlite-api
          if find internal/store/queries -name '*.sql' 2>/dev/null | head -1 | grep -q .; then
            sqlc vet
          else
            echo "No query files yet, skipping sqlc vet"
          fi
      - name: Test
        run: cd classlite-api && go test ./... -race -v
        env:
          DATABASE_URL: postgres://classlite:test@localhost:5432/classlite_test?sslmode=disable
      - name: Verify audio transcode tests ran (AC7 — no silent skip)
        # Guards the Story 6.3b0 requirement that the FFmpegTranscoder integration
        # tests are NOT silently skipped in CI. If ffmpeg were somehow absent the
        # tests LOUD-skip; this step fails the build on any SKIP and requires the
        # normalization test to have actually PASSED.
        run: |
          set -o pipefail  # a non-zero `go test` exit (build failure/panic) must fail the step, not be swallowed by tee
          cd classlite-api
          go test -run 'TestFFmpegTranscoder|TestCheckFFmpegAvailable' -v ./internal/media/... | tee /tmp/media-test.out
          if grep -q -- '--- SKIP' /tmp/media-test.out; then
            echo "::error::Story 6.3b0 AC7 — audio transcode tests were SKIPPED (ffmpeg missing?). CI must provide ffmpeg."
            exit 1
          fi
          if ! grep -q -- '--- PASS: TestFFmpegTranscoder_NormalizesWebmAndM4a_ATDD' /tmp/media-test.out; then
            echo "::error::Story 6.3b0 AC7 — the transcode normalization test did not run/pass."
            exit 1
          fi
      - name: Build
        run: cd classlite-api && go build ./cmd/api/...
