name: CI — API

on:
  push:
    paths: ['classlite-api/**', '.github/workflows/ci-api.yml']
  pull_request:
    paths: ['classlite-api/**', '.github/workflows/ci-api.yml']
  # Nightly (+ manual) full -race run. -race over the whole DB-integration suite
  # is ~50m serially (-p 1 is mandatory — see the Test step), far too slow for the
  # push critical path, so race detection runs off it on a schedule. Scheduled runs
  # fire only on the default branch.
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: classlite_test
          POSTGRES_USER: classlite
          POSTGRES_PASSWORD: test
        ports:
          - '5432:5432'
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - name: Generate sqlc store
        # internal/store/generated is gitignored (sqlc output), so a fresh checkout
        # has no Go store — the Lint (type-check) and Test steps below both import it.
        # Must run BEFORE golangci-lint, or lint reports the missing package as issues.
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
          cd classlite-api && sqlc generate
      - name: Install ffmpeg (Story 6.3b0 — audio transcode integration tests)
        # The internal/media FFmpegTranscoder tests are INTEGRATION tests against
        # a real ffmpeg (webm/mp4 → Opus/Ogg). Install it explicitly rather than
        # relying on the runner image so the tests always RUN (AC7: no silent
        # green). ffprobe ships in the same apt package and is used by the AC2
        # structural assertion.
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1
      - name: Lint (golangci-lint)
        # Runs the standard-linter set defined in classlite-api/.golangci.yml
        # (errcheck / govet / staticcheck / unused / ineffassign). Replaces the
        # prior standalone `go vet` + `staticcheck` steps — same underlying
        # tools, one binary, one AST walk.
        # v8 action + golangci-lint v2 (built with a current Go): the v6 action caps
        # to golangci-lint v1 (built with go1.24), which REFUSES a go1.25 module
        # ("Go language version used to build golangci-lint is lower than target").
        # .golangci.yml is v2-format (migrated via `golangci-lint migrate`).
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0
          working-directory: classlite-api
      - name: Tenantcheck (R1 mitigation A — GO-1 enforcement)
        # Custom analyzer that fails the build if any method on a *Store type
        # is missing TenantContext as its second parameter. Runs standalone
        # (not through golangci-lint custom binary) so violations point
        # unambiguously to project-context.md GO-1. See
        # _bmad-output/test-artifacts/test-design/pre-epic-2-blockers-2026-06-30.md
        # and tools/tenantcheck/ for the mechanism.
        #
        # Two calls: (a) run the analyzer's own tests — asserts the negative
        # fixtures still fire diagnostics (teeth check); (b) run the analyzer
        # against the real store package.
        run: |
          cd classlite-api
          go test ./tools/tenantcheck/...
          go run ./tools/tenantcheck/cmd/tenantcheck ./internal/store/...
      - name: sqlc vet
        run: |
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@latest
          cd classlite-api
          if find internal/store/queries -name '*.sql' 2>/dev/null | head -1 | grep -q .; then
            sqlc vet
          else
            echo "No query files yet, skipping sqlc vet"
          fi
      - name: Bootstrap + migrate test DB (Story 11-1a / AC6 / DD16)
        # Prepares classlite_test for the WHOLE `go test ./...` run (not just the
        # internal/test package, which owns its own TestMain lifecycle). Mirrors
        # internal/test/testdb.go's EnsureTestDB operations — they must stay in
        # sync as "the test-DB lifecycle". Migrations run as the dedicated
        # NON-superuser classlite_migrator (DD16b); BYPASSRLS is required because
        # the Epic-9 polar tenant-resolution SECURITY DEFINER functions resolve
        # across tenants (FU-11-1A-MIGRATOR-BYPASSRLS). A throwaway classlite_dev
        # exists so the immutable 20260601110000 GRANT replays clean (DD16d).
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          curl -fsSL https://github.com/golang-migrate/migrate/releases/download/v4.19.1/migrate.linux-amd64.tar.gz | tar xz
          sudo mv migrate /usr/local/bin/migrate
          export PGPASSWORD=test
          PSQL="psql -h localhost -U classlite -v ON_ERROR_STOP=1"
          $PSQL -d postgres -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='classlite_migrator') THEN CREATE ROLE classlite_migrator LOGIN PASSWORD 'classlite_migrator_dev_password' NOSUPERUSER CREATEROLE BYPASSRLS; END IF; END \$\$;"
          $PSQL -d postgres -tc "SELECT 1 FROM pg_database WHERE datname='classlite_dev'" | grep -q 1 || $PSQL -d postgres -c "CREATE DATABASE classlite_dev"
          $PSQL -d postgres -c "ALTER DATABASE classlite_test OWNER TO classlite_migrator"
          $PSQL -d postgres -c "GRANT CONNECT ON DATABASE classlite_dev TO classlite_migrator WITH GRANT OPTION"
          migrate -path classlite-api/migrations -database "postgres://classlite_migrator:classlite_migrator_dev_password@localhost:5432/classlite_test?sslmode=disable" up
      - name: Test
        # -p 1 serializes PACKAGE test binaries (one at a time) — MANDATORY: the
        # DB-integration packages all hit one shared Postgres and take
        # pg_advisory_xact_lock (9-1a) + committed-pool fixtures, so running their
        # binaries concurrently (default -p = nCPU) cross-contends (and under -race
        # on the constrained runner, starved internal/handler into the 25m Go test
        # timeout — a CI-only contention, not a code deadlock: every local config,
        # incl. forced 6-way concurrency under GOMAXPROCS=2, finishes in <20s).
        #
        # -race is applied ONLY on the nightly schedule / manual dispatch — the full
        # serial -race suite is ~50m, too slow for every push. Push/PR runs are
        # race-free (fast); race detection runs nightly off the critical path.
        run: |
          cd classlite-api
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "nightly/manual → full -race run"
            go test ./... -race -v -p 1 -timeout 55m
          else
            go test ./... -v -p 1 -timeout 15m
          fi
        env:
          # App role (non-superuser, RLS-enforced) against the migrated test DB.
          DATABASE_URL: postgres://classlite_app:classlite_dev_password@localhost:5432/classlite_test?sslmode=disable
          # Superuser pool (RLS-bypassing seed/reset helpers) against the same DB.
          MIGRATION_DATABASE_URL: postgres://classlite:test@localhost:5432/classlite_test?sslmode=disable
          # The DB is already bootstrapped+migrated by the step above; TestMain
          # trusts it instead of re-bootstrapping (it would need superuser creds).
          SKIP_TEST_DB_BOOTSTRAP: "1"
      - name: Verify audio transcode tests ran (AC7 — no silent skip)
        # Guards the Story 6.3b0 requirement that the FFmpegTranscoder integration
        # tests are NOT silently skipped in CI. If ffmpeg were somehow absent the
        # tests LOUD-skip; this step fails the build on any SKIP and requires the
        # normalization test to have actually PASSED.
        run: |
          set -o pipefail  # a non-zero `go test` exit (build failure/panic) must fail the step, not be swallowed by tee
          cd classlite-api
          go test -run 'TestFFmpegTranscoder|TestCheckFFmpegAvailable' -v ./internal/media/... | tee /tmp/media-test.out
          if grep -q -- '--- SKIP' /tmp/media-test.out; then
            echo "::error::Story 6.3b0 AC7 — audio transcode tests were SKIPPED (ffmpeg missing?). CI must provide ffmpeg."
            exit 1
          fi
          if ! grep -q -- '--- PASS: TestFFmpegTranscoder_NormalizesWebmAndM4a_ATDD' /tmp/media-test.out; then
            echo "::error::Story 6.3b0 AC7 — the transcode normalization test did not run/pass."
            exit 1
          fi
      - name: Build
        run: cd classlite-api && go build ./cmd/api/...
