name: CI — Web Dashboard

on:
  push:
    paths:
      - 'classlite-web/**'
      - 'classlite-landing/src/styles/tokens.css'
      - 'scripts/sync-tokens.sh'
      - '.github/workflows/ci-web.yml'
      # Story 11-5a (AC6, party-mode Winston #1) — the money-path job exercises
      # the REAL API half (submission lifecycle + grading + /result). Trigger on
      # API + migration changes too, or an API-side regression ships to Railway
      # (ci-api green) while this gate never fires — making "a regression stops
      # shipping" false for exactly the half where grading lives.
      - 'classlite-api/**'
      - 'classlite-api/migrations/**'
      - 'scripts/seed.sh'
  pull_request:
    paths:
      - 'classlite-web/**'
      - 'classlite-landing/src/styles/tokens.css'
      - 'scripts/sync-tokens.sh'
      - '.github/workflows/ci-web.yml'
      - 'classlite-api/**'
      - 'classlite-api/migrations/**'
      - 'scripts/seed.sh'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve PR base ref
        if: ${{ github.event_name == 'pull_request' }}
        run: git fetch origin ${{ github.base_ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: cd classlite-web && npm ci
      - name: Verify tokens.css parity (Story 1.7a AC2)
        run: |
          bash scripts/sync-tokens.sh
          if ! git diff --exit-code -- classlite-landing/src/styles/tokens.css; then
            echo "::error::tokens.css drift detected. Run ./scripts/sync-tokens.sh locally and commit."
            exit 1
          fi
      - name: Guard against hand-edits in components/ui (Story 1.7a AC6 — advisory)
        if: ${{ github.event_name == 'pull_request' }}
        env:
          DIFF_RANGE: origin/${{ github.base_ref }}...HEAD
          LOG_RANGE: origin/${{ github.base_ref }}..HEAD
        run: |
          # `git log A..B` (two dots) shows commits in B not in A — PR commits.
          # Three-dot symmetric difference could match base-only commits on
          # non-fast-forward branches and silently allowlist a PR.
          if git log --format='%B' "$LOG_RANGE" | grep -qF '[shadcn]'; then
            echo "::notice::[shadcn] tag detected — skipping components/ui hand-edit guard."
            exit 0
          fi
          # `:(glob)` enables real recursive ** matching; the default pathspec
          # treats ** as a single segment and misses nested files. Grep covers
          # Added/Deleted/Renamed too — new hand-written primitives and sneaky
          # deletions should also surface, not just modifications.
          changes=$(git diff --name-status "$DIFF_RANGE" -- ':(glob)classlite-web/src/components/ui/**' | grep -E '^(M|A|D|R)' || true)
          if [ -n "$changes" ]; then
            echo "::warning::Changes detected under classlite-web/src/components/ui/ (M/A/D/R):"
            echo "$changes"
            echo "::warning::These files are shadcn-generated (FW-7). If this is a legitimate 'npx shadcn add' re-run, add [shadcn] to the commit message and re-push."
            echo "::warning::If this is a manual edit, FW-7 forbids it. Wrap the change in src/components/domain/ instead, or edit src/index.css for token changes."
          fi
      - name: Lint (ESLint)
        run: cd classlite-web && npm run lint
      - name: Lint (Stylelint)
        run: cd classlite-web && npm run lint:css
      - name: Type check
        # Story 11-5a (closes FU-11-TSC) — `tsc -b` is the real gate: it checks
        # the test projects (src AND tests/e2e via tsconfig.e2e.json), whereas
        # `tsc --noEmit` resolves against the solution-style root config and
        # false-greens on test files ([[reference_web_typecheck_gate_is_tsc_b]]).
        run: cd classlite-web && npx tsc -b
      - name: i18n parity (Story 1.7c AC9 — R38 mitigation)
        # Blocks merge when en.json and vi.json key sets diverge or any
        # locale value is empty. Vietnamese is co-primary; a missing key
        # or blank value in vi.json ships as a raw `app.x.y` token (or
        # blank UI) to half the user base — invisible to English-speaking
        # reviewers without this guard. Runs BEFORE Test so a drift fails
        # fast with a readable diff instead of surfacing as confusing
        # missing-key throws inside component tests downstream.
        run: cd classlite-web && npm run i18n-parity
      - name: Test
        run: cd classlite-web && npx vitest run --passWithNoTests
      - name: Build
        run: cd classlite-web && npm run build
      - name: Epic 1C NFR-3 — Lighthouse CI (/login baseline)
        # Closes the second half of the Concern from
        # `_bmad-output/test-artifacts/nfr-assessment-epic-1c.md`. The
        # web dashboard is mostly authenticated, so the only public route
        # we can Lighthouse without auth shenanigans is `/login`. That's
        # still load-bearing — every authenticated session funnels through
        # it on first visit + session-expiry recovery. lhci boots
        # `vite preview` via `startServerCommand` (lighthouserc.json) and
        # tears it down after collection.
        #
        # Thresholds (lighthouserc.json):
        #   - accessibility ≥ 0.95 (ERROR)
        #   - performance ≥ 0.8 (WARN — auth screen has heavier vendor chunk than landing)
        #   - best-practices ≥ 0.85, SEO ≥ 0.85 (WARN — /login is not SEO-critical)
        # `numberOfRuns: 3` medians out CI runner noise.
        run: cd classlite-web && npx -y @lhci/cli@latest autorun --config=./lighthouserc.json

  storybook:
    # Story 1d-1 AC6 — Storybook foundation gate. All four checks below
    # are REQUIRED to pass before merge. Soft cap 8 minutes on PR;
    # shard `test-storybook --shard N/M` once the runtime trend exceeds
    # the cap (see classlite-web/docs/storybook-conventions.md § 6).
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: cd classlite-web && npm ci
      - name: Install Playwright browser (chromium only)
        # The test-runner drives stories via Playwright. Pinning to
        # chromium-only keeps install time under ~25s on the runner.
        run: cd classlite-web && npx playwright install --with-deps chromium
      - name: i18n parity (Story 1.7c AC9 / 1d-1 AC4 — R38 mitigation)
        # Required by both the `test` job and this `storybook` job. The
        # duplication is intentional: it lets the storybook job fail fast
        # on a key drift without waiting on the test job to surface it.
        run: cd classlite-web && npm run i18n-parity
      - name: Storybook build + test-runner (AC3 three-state + AC5 axe + AC7 placement + smoke render)
        # `storybook:test:ci` chains storybook:build → serve → test, so
        # this single step covers Tier A check 5 AND the test-runner pass.
        run: cd classlite-web && npm run storybook:test:ci
      - name: Upload static Storybook artifact
        # Designer access (AC8 § 10) — preview deployment to Cloudflare
        # Pages is a follow-up improvement story; for now the static
        # bundle is downloadable from the Actions run. `if-no-files-found:
        # error` so a failed build that omits the static dir does NOT
        # silently upload an empty artifact (designers would download an
        # empty zip with no obvious cause).
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: classlite-web/storybook-static
          retention-days: 14
          if-no-files-found: error

  money-path:
    # Story 11-5a (AC6) — THE deterministic money-path gate. Stands up the FULL
    # real stack (Postgres + migrated schema + seeded tenant + the Go API) and
    # runs the single Playwright journey (owner/teacher → class → assign → all 4
    # attempt types → deterministic grade → student reads result) against a BUILT
    # Vite preview. Lives in THIS workflow (CI — Web Dashboard) so a failure
    # auto-gates the web deploy: deploy.yml fires deploy-web only on this
    # workflow's `success` (deploy.yml:23). Runs with NO GEMINI_API_KEY — the
    # deterministic path never touches Gemini (AC3); the API boots fine without
    # it in APP_ENV=development (gemini.NewClient makes no network call at
    # construction).
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: classlite_test
          POSTGRES_USER: classlite
          POSTGRES_PASSWORD: test
        ports:
          - '5432:5432'
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # App role (RLS-enforced) + superuser pool (seed reset cascade over the
      # DELETE-revoked grades table). Both created/established by `migrate up`.
      DATABASE_URL: postgres://classlite_app:classlite_dev_password@localhost:5432/classlite_test?sslmode=disable
      MIGRATION_DATABASE_URL: postgres://classlite:test@localhost:5432/classlite_test?sslmode=disable
      # The API must emit the refresh cookie on `.classlite.localhost` and NOT as
      # Secure (http preview) — else every boot is a silent logged-out guest.
      COOKIE_DOMAIN: .classlite.localhost
      APP_ENV: development
      CORS_ORIGINS: http://my.classlite.localhost:5173,http://classlite.localhost:4321
      PORT: '8080'
      # Explicit opt-in (code-review 4b) for the DEV-ONLY mock-R2 presigned-PUT sink —
      # the speaking money-path leg round-trips through it in this credentials-free stack.
      ENABLE_DEV_MOCK_R2_SINK: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve *.classlite.localhost to loopback
        # GitHub runners resolve only `localhost`, not `*.classlite.localhost`.
        # The preview baseURL + the cross-subdomain host must map to 127.0.0.1 so
        # the refresh cookie (Domain=.classlite.localhost) carries.
        run: |
          echo "127.0.0.1 my.classlite.localhost classlite.localhost" | sudo tee -a /etc/hosts
      - name: Bootstrap + migrate test DB (mirrors ci-api.yml)
        # Same 3-role bootstrap as ci-api: classlite_migrator (owns + migrates),
        # a throwaway classlite_dev so the immutable GRANT replays, then
        # `migrate up` (which also establishes classlite_app, used by DATABASE_URL).
        run: |
          sudo apt-get update && sudo apt-get install -y postgresql-client
          curl -fsSL https://github.com/golang-migrate/migrate/releases/download/v4.19.1/migrate.linux-amd64.tar.gz | tar xz
          sudo mv migrate /usr/local/bin/migrate
          export PGPASSWORD=test
          PSQL="psql -h localhost -U classlite -v ON_ERROR_STOP=1"
          $PSQL -d postgres -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='classlite_migrator') THEN CREATE ROLE classlite_migrator LOGIN PASSWORD 'classlite_migrator_dev_password' NOSUPERUSER CREATEROLE BYPASSRLS; END IF; END \$\$;"
          $PSQL -d postgres -tc "SELECT 1 FROM pg_database WHERE datname='classlite_dev'" | grep -q 1 || $PSQL -d postgres -c "CREATE DATABASE classlite_dev"
          $PSQL -d postgres -c "ALTER DATABASE classlite_test OWNER TO classlite_migrator"
          $PSQL -d postgres -c "GRANT CONNECT ON DATABASE classlite_dev TO classlite_migrator WITH GRANT OPTION"
          migrate -path classlite-api/migrations -database "postgres://classlite_migrator:classlite_migrator_dev_password@localhost:5432/classlite_test?sslmode=disable" up
      - name: Seed tenant + emit credentials.json
        # `scripts/seed.sh` (clean=true default) seeds tenant A + identities and
        # emits classlite-web/tests/e2e/.auth/credentials.json. The clean reset
        # cascades over the DELETE-revoked grades table, so it needs the superuser
        # MIGRATION_DATABASE_URL (provided via job env).
        run: bash scripts/seed.sh
      - name: Build + start the API (go build → run binary, not go run)
        # A built binary (not fire-and-forget `go run`) so the process is a stable
        # pid we can background; nohup survives into the later steps on the runner.
        run: |
          cd classlite-api && go build -o /tmp/classlite-api ./cmd/api
          nohup /tmp/classlite-api > /tmp/api.log 2>&1 &
          echo "API started (pid $!)"
      - name: Wait for /health = 200
        # /health is 503 until the pool pings Postgres (health_handler.go:19), so
        # this is the real readiness gate before Playwright drives the stack.
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health > /dev/null; then
              echo "API healthy"; cat /tmp/api.log | tail -5; exit 0
            fi
            sleep 2
          done
          echo "::error::API did not become healthy in time"; cat /tmp/api.log; exit 1
      - name: Install web deps
        run: cd classlite-web && npm ci
      - name: Install Playwright chromium (+ deps for headless fake media)
        run: cd classlite-web && npx playwright install --with-deps chromium
      - name: Money-path smoke (built preview, workers=1, NO GEMINI_API_KEY)
        # MONEY_PATH_PREVIEW makes playwright.config serve ONLY the built preview
        # (npm run build && npm run preview, proxying /api → :8080). The money-path
        # project carries project-scoped retries (CI×1) + the fake-media launch
        # flags. GEMINI_API_KEY is intentionally UNSET.
        run: cd classlite-web && MONEY_PATH_PREVIEW=1 npx playwright test --project=money-path --workers=1
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: money-path-playwright-report
          path: classlite-web/playwright-report
          retention-days: 14
          if-no-files-found: ignore
