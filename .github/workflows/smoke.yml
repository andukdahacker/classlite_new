name: Smoke — post-deploy (non-gating)

# Story 11-8a — AC3. Runs AFTER Railway cuts traffic to the new image, as a SEPARATE workflow
# triggered on the GitHub deployment_status Railway emits. It is NON-GATING on purpose: a smoke
# that lived inside the gated check-suite (deploy.yml) would deadlock (the suite waits on the
# cutover, the cutover waits on the suite). On a smoke failure this workflow triggers the
# documented rollback (scripts/rollback.sh) and fails LOUD so a human is paged — it does not
# block the (already-completed) cutover.
#
# Railway's own /health healthcheck is the native cutover gate (Railway won't shift traffic to a
# deployment whose /health fails, and keeps the prior one serving). This smoke layers an explicit
# authenticated-route assertion on top — the only check that exercises the real classlite_app
# connection and thus catches AC7's password rotation breaking it.

on:
  deployment_status:

jobs:
  smoke:
    # Only when Railway reports a SUCCESSFUL production deployment.
    if: github.event.deployment_status.state == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: /health → 200 {"status":"ok","db":"connected"}
        env:
          API_URL: ${{ vars.PROD_API_URL }}
        run: |
          set -euo pipefail
          body="$(curl -fsS --max-time 15 "$API_URL/health")"
          echo "health: $body"
          echo "$body" | grep -q '"status":"ok"'       || { echo "::error::/health status not ok"; exit 1; }
          echo "$body" | grep -q '"db":"connected"'    || { echo "::error::/health db not connected"; exit 1; }

      - name: Protected route with NO token → 401 (auth routing live end-to-end)
        env:
          API_URL: ${{ vars.PROD_API_URL }}
          PROTECTED_PATH: ${{ vars.SMOKE_PROTECTED_PATH }}
        run: |
          set -euo pipefail
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 15 "$API_URL$PROTECTED_PATH")"
          echo "no-token $PROTECTED_PATH → $code"
          [ "$code" = "401" ] || { echo "::error::expected 401 from $PROTECTED_PATH with no token, got $code"; exit 1; }

      - name: Authenticated 200 (real classlite_app path — catches AC7 pw rotation breakage)
        # A dead-DB/broken app ALSO returns 401, so 401-only is liveness cosplay. This logs in a
        # synthetic monitor account, then asserts a cheap seeded read returns 200 with the
        # expected payload shape — the only signal that the app's real classlite_app connection
        # works against the migrated schema.
        env:
          API_URL: ${{ vars.PROD_API_URL }}
          READ_PATH: ${{ vars.SMOKE_READ_PATH }}
          SMOKE_EMAIL: ${{ secrets.SMOKE_EMAIL }}
          SMOKE_PASSWORD: ${{ secrets.SMOKE_PASSWORD }}
        run: |
          set -euo pipefail
          login="$(curl -fsS --max-time 15 -X POST "$API_URL/api/auth/login" \
            -H 'Content-Type: application/json' \
            --data "$(python3 -c 'import json,os;print(json.dumps({"email":os.environ["SMOKE_EMAIL"],"password":os.environ["SMOKE_PASSWORD"],"rememberMe":False}))')")"
          token="$(printf '%s' "$login" | python3 -c 'import sys,json;print(json.load(sys.stdin)["data"]["accessToken"])')"
          [ -n "$token" ] || { echo "::error::login returned no accessToken"; exit 1; }
          code="$(curl -s -o /tmp/read.json -w '%{http_code}' --max-time 15 -H "Authorization: Bearer $token" "$API_URL$READ_PATH")"
          echo "authed $READ_PATH → $code"
          [ "$code" = "200" ] || { echo "::error::authenticated read $READ_PATH returned $code (classlite_app path broken?)"; exit 1; }
          # Payload-shape assertion: the envelope carries a data key (GFW-5).
          python3 -c 'import json;json.load(open("/tmp/read.json"))["data"]' || { echo "::error::read payload missing data envelope"; exit 1; }

      - name: Rollback on smoke failure (revert IMAGE only; migrations are expand/contract)
        if: failure()
        env:
          RAILWAY_API_TOKEN: ${{ secrets.RAILWAY_API_TOKEN }}
          RAILWAY_SERVICE_ID: ${{ secrets.RAILWAY_API_SERVICE_ID }}
          RAILWAY_ENVIRONMENT_ID: ${{ secrets.RAILWAY_ENVIRONMENT_ID }}
        run: |
          echo "::warning::smoke failed — rolling back the image to the previous deployment (migrations are NOT reverted; expand/contract keeps the old image compatible)."
          scripts/rollback.sh
