  # ---------------- Story 5.1 — Assignments & submission lifecycle ----------------
  /api/assignments:
    post:
      operationId: createAssignment
      summary: Create an assignment — bind an exercise to a class with a deadline (story 5.1 — AC1)
      description: |
        Teacher/Admin/Owner only. The exerciseId + classId must resolve to
        non-deleted rows in the caller's center (else 422 INVALID_REFERENCE). A
        teacher may only assign a class they own (else 404 CLASS_NOT_FOUND —
        teacher-sees-nothing). hardDeadlineAt, when present, must be >= deadlineAt
        (else 422 INVALID_DEADLINE). Created open.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAssignmentRequest'
      responses:
        "201":
          description: Created assignment (status=open)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeAssignment'
        "401":
          description: AUTH_REQUIRED / AUTH_INVALID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: INSUFFICIENT_ROLE (student callers — teacher/admin/owner only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "404":
          description: CLASS_NOT_FOUND (class not in caller's center or outside teacher scope)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "413":
          description: PAYLOAD_TOO_LARGE (body exceeds cap)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "422":
          description: VALIDATION_ERROR / INVALID_REFERENCE (exerciseId/classId unresolved) / INVALID_DEADLINE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    get:
      operationId: listStudentAssignments
      summary: List the caller's assignments — student, enrollment-scoped (story 5.2a — AC1,2,3,4)
      description: |
        Student only (non-student → 403 INSUFFICIENT_ROLE — teachers use
        GET /api/classes/{classId}/assignments). Returns only assignments whose
        class the caller is ACTIVELY enrolled in (an enrollments row status='active');
        a withdrawn enrollment yields zero rows for that class. Rows are the
        student-safe StudentAssignmentListItem (StudentAssignmentView + exercise
        title/skill + the caller's own submission summary), ordered by
        deadlineAt ASC (due-soonest first), stable tiebreak on id. Paginated (XL-2).
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: The caller's enrollment-scoped assignment list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeStudentAssignmentList'
        "401":
          description: AUTH_REQUIRED / AUTH_INVALID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: INSUFFICIENT_ROLE (non-student callers — students only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

