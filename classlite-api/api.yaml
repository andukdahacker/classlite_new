  /api/submissions/{id}/attempt:
    get:
      operationId: getSubmissionAttempt
      summary: Open a submission's attempt bundle — answer-stripped exercise + student's draft (story 5.2a — AC5-12)
      description: |
        Student only (non-student → 403 INSUFFICIENT_ROLE). The caller must OWN the
        submission (student_id = caller; else 404 SUBMISSION_NOT_FOUND — never a
        403 that confirms existence) AND be ACTIVELY enrolled in the assignment's
        class (else 403 NOT_ENROLLED — re-checked on read). Returns the full
        Submission (the student's own saved answers), the student-safe assignment
        subset, and the answer-stripped AttemptExercise: correctAnswer/acceptedVariants
        are structurally absent from every AttemptQuestion (never on the wire). Read
        is NOT lock-gated (D6) — a closed assignment or passed hard deadline still
        returns 200 so the FE can render the locked draft read-only; only the 5.1
        write paths enforce SUBMISSION_LOCKED. meta.serverTime is the timer anchor.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The attempt bundle (submission + student-safe assignment + answer-stripped exercise)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeAttemptBundle'
        "401":
          description: AUTH_REQUIRED / AUTH_INVALID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: NOT_ENROLLED (withdrawn mid-attempt) / INSUFFICIENT_ROLE (non-student)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "404":
          description: SUBMISSION_NOT_FOUND (absent, wrong center, or not the caller's own)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/assignments/{assignmentId}/result:
    get:
      operationId: getSubmissionResult
      summary: Review my own submission — pre-grade read-back (story 5.5a — assignment-keyed)
      description: |
        Student only (non-student → 403 INSUFFICIENT_ROLE). Resolves the caller's
        UNIQUE (student_id, assignment_id) submission — student_id is the
        authenticated principal, NEVER a request param (SEC-1). The caller must be
        ACTIVELY enrolled in the assignment's class (else 403 NOT_ENROLLED). No
        submission for (caller, assignment) → 404 SUBMISSION_NOT_FOUND (never a 403
        existence oracle; a cross-student assignment the caller never submitted to
        is the same 404). Both the submission read AND the assignment read run under
        the tenant RLS tx — a cross-tenant assignmentId leaks nothing.

        NOT lock-gated (D6) — a closed assignment or passed hard deadline still
        returns 200 read-only. An in_progress submission short-circuits (D10) to a
        resume-CTA payload: inProgress=true, exercise=null, audioUrl=null, NO
        answer-strip and NO presign. A terminal submission returns the answer-
        stripped AttemptExercise (correctAnswer/acceptedVariants structurally
        absent), released=false (grades land in 5.5b), and — for a speaking
        submission carrying an audioKey — a fresh 5-minute presigned GET audioUrl
        (SEC-8 prefix-guarded, minted OUTSIDE the read tx per PERF-1; a non-speaking
        or nil-audioKey submission → audioUrl null). The endpoint name /result is
        the frozen 5.5b contract; the FE route is /assignments/:id/submission.
      security:
        - bearerAuth: []
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The submission review payload (read-back shell; in_progress → resume CTA)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeStudentSubmissionResult'
        "401":
          description: AUTH_REQUIRED / AUTH_INVALID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: NOT_ENROLLED (withdrawn) / INSUFFICIENT_ROLE (non-student)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "404":
          description: SUBMISSION_NOT_FOUND (no submission for the caller + assignment; no cross-student oracle)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/assignments/{assignmentId}/submission/audio:
    get:
      operationId: getSubmissionAudioUrl
      summary: Fresh presigned GET for my own speaking recording (story 5.5a — on-demand play-intent)
      description: |
        Rides the SAME gate ladder as GET /api/assignments/{assignmentId}/result
        (student-only, caller-owned, actively-enrolled). Mints a fresh 5-minute
        presigned GET (SEC-8 prefix-guarded, via StorageService.PresignGetOwned) for
        the caller's own speaking submission audioKey, so a play-intent after the
        inline first-paint URL has aged past ~4 minutes never hits a dead R2 URL.
        Every gated failure returns its error status and mints NOTHING. A submission
        with no audioKey (non-speaking / in_progress) → 404 SUBMISSION_NOT_FOUND (no
        audio to serve). Never a PUT; the URL is never logged (A10).
      security:
        - bearerAuth: []
      parameters:
        - name: assignmentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A fresh 5-minute presigned GET url for the caller's own recording
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeAudioUrl'
        "401":
          description: AUTH_REQUIRED / AUTH_INVALID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: NOT_ENROLLED (withdrawn) / INSUFFICIENT_ROLE (non-student)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "404":
          description: SUBMISSION_NOT_FOUND (no submission, or no audio for the caller + assignment)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/submissions/{id}/progress:
    put:
      operationId: saveSubmissionProgress
      summary: Save in-progress attempt content (story 5.1 — AC9,10)
      description: |
        Owner student only, in_progress only (DB-guarded — 0 rows → 409
        SUBMISSION_NOT_EDITABLE). Re-checks active enrollment (403 NOT_ENROLLED). A
        timed exercise past started_at + timeLimit + grace → 409 TIME_EXPIRED. A
        closed assignment or passed hard deadline → 409 SUBMISSION_LOCKED. Body
        over the serialized-JSONB cap → 413 PAYLOAD_TOO_LARGE.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveSubmissionProgressRequest'
      responses:
        "200":
          description: The updated submission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeSubmission'
        "401":
          description: AUTH_REQUIRED / AUTH_INVALID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: NOT_ENROLLED / INSUFFICIENT_ROLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "404":
          description: SUBMISSION_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "409":
          description: SUBMISSION_NOT_EDITABLE (not in_progress) / TIME_EXPIRED / SUBMISSION_LOCKED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "413":
          description: PAYLOAD_TOO_LARGE (serialized content over the cap)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/submissions/{id}/submit:
    post:
      operationId: submitSubmission
      summary: Submit an attempt — atomic status + late flag + penalty snapshot (story 5.1 — AC11,12)
      description: |
        Owner student only, in_progress only (0 rows → 409 SUBMISSION_NOT_EDITABLE).
        Re-checks active enrollment (403 NOT_ENROLLED). A single atomic UPDATE sets
        submitted, submitted_at (server clock), is_late (submitted_at > deadline_at,
        strict), and snapshots the point-in-time late penalty. Allowed after time
        expiry (client auto-submits). A closed assignment or passed hard deadline →
        409 SUBMISSION_LOCKED.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The submitted submission
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeSubmission'
        "401":
          description: AUTH_REQUIRED / AUTH_INVALID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: NOT_ENROLLED / INSUFFICIENT_ROLE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "404":
          description: SUBMISSION_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "409":
          description: SUBMISSION_NOT_EDITABLE (not in_progress) / SUBMISSION_LOCKED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/submissions/{submissionId}/grade:
    post:
      operationId: gradeSubmission
      summary: Grade a Writing submission and release it — create + release, atomic (story 6.1 — AC4)
      description: |
        Teacher/admin/owner only, AND (for a teacher) assigned to the class the
        submission's assignment belongs to — else 403 INSUFFICIENT_ROLE / 403
        FORBIDDEN. Non-submitted/absent submission resolved within RLS → 404/409
        (no cross-tenant existence oracle).

        overallBand is NOT a request field — it is not part of GradeInput and the
        server computes it from the four criterion scores (IELTS half-rounding,
        integer-space, AC7). Bodies are strictly decoded, so a request that
        includes overallBand (or any other unknown field) is REJECTED with 422. In
        ONE tx (DB writes only, D2): insert grade
        (version=1, released_at=now()), flip submission submitted→graded, audit
        grade.created + grade.released, and a durable notification-outbox job row
        (idempotency key = gradeId). AFTER COMMIT the outbox dispatcher publishes
        event.GradeReleased + sends the Resend email (behind GRADE_RELEASE_EMAIL_ENABLED,
        idempotent on gradeId). A second grade on an already-graded submission →
        409 SUBMISSION_ALREADY_GRADED (checked under the row lock; the losing writer
        commits zero side effects). Immutable-once-released (NFR-6).
      security:
        - bearerAuth: []
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GradeInput'
      responses:
        "201":
          description: Grade created + released
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeGrade'
        "401":
          description: AUTH_REQUIRED / AUTH_INVALID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: INSUFFICIENT_ROLE (non-staff) / FORBIDDEN (not teacher of the class)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "404":
          description: SUBMISSION_NOT_FOUND (absent or cross-tenant)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "409":
          description: SUBMISSION_ALREADY_GRADED (already graded) / SUBMISSION_NOT_GRADABLE (not yet submitted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "413":
          description: PAYLOAD_TOO_LARGE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "422":
          description: VALIDATION_ERROR (missing/invalid criterion scores or comment shape)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/submissions/{submissionId}/grade/revise:
    post:
      operationId: reviseGrade
      summary: Revise & re-release a grade — appends version N+1 (story 6.1 — AC6)
      description: |
        Same authz as POST …/grade. Inserts a NEW grades row version = MAX+1,
        released_at=now(); the prior row is untouched and the submission row is NOT
        updated (it stays graded — the immutability trigger would RAISE otherwise;
        the current version lives in the current_grades view, D1). reason is
        required. Two concurrent revises both computing N+1 → the UNIQUE(submission_id,
        version) index rejects the loser (23505) → 409 CONFLICT retry, loser emits
        zero side effects (B3). Audit grade.revised + grade.re_released; re-publish +
        re-notify via the same outbox (post-commit, D2).
      security:
        - bearerAuth: []
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReviseGradeInput'
      responses:
        "201":
          description: New grade version created + released
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeGrade'
        "401":
          description: AUTH_REQUIRED / AUTH_INVALID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: INSUFFICIENT_ROLE / FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "404":
          description: SUBMISSION_NOT_FOUND / GRADE_NOT_FOUND (no grade to revise)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "409":
          description: CONFLICT (concurrent revise lost the version race — retry)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "413":
          description: PAYLOAD_TOO_LARGE
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "422":
          description: VALIDATION_ERROR (missing reason / invalid scores or comments)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/submissions/{submissionId}/grading:
    get:
      operationId: getSubmissionGrading
      summary: Teacher grading read — full submission + assignment + student + exercise + current grade (story 6.1 — AC8)
      description: |
        Teacher/admin/owner only, teacher-of-class scoped (else 404, no oracle).
        Returns the FULL submission (NOT answer-stripped — the teacher reads the
        essay), the assignment, the student {id, fullName}, the exercise, and the
        latest grade (via current_grades) or null when ungraded. Distinct from the
        student attempt bundle (wrong principal, strips content).
      security:
        - bearerAuth: []
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The teacher grading view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeTeacherGradingView'
        "401":
          description: AUTH_REQUIRED / AUTH_INVALID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: INSUFFICIENT_ROLE (non-staff)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "404":
          description: SUBMISSION_NOT_FOUND (absent, cross-tenant, or not the teacher's class)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/classes/{classId}/grading-queue:
    get:
      operationId: getGradingQueue
      summary: Teacher grading queue for an assignment — submissions to grade (story 6.1 — AC17)
      description: |
        Teacher/admin/owner only, teacher-of-class scoped (else 404). Lists every
        non-in_progress submission for the given assignment (oldest waiting first)
        with the student's name and current release state, so the teacher can walk
        prev/next through the queue. assignmentId is a required query param and must
        belong to classId (else 404).
      security:
        - bearerAuth: []
      parameters:
        - name: classId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: assignmentId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The grading queue rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeGradingQueue'
        "401":
          description: AUTH_REQUIRED / AUTH_INVALID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: INSUFFICIENT_ROLE (non-staff)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "404":
          description: CLASS_NOT_FOUND / ASSIGNMENT_NOT_FOUND (absent, cross-tenant, or not the teacher's class)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

components:
  schemas:
    # ---------------- Request bodies ----------------
    RegisterRequest:
      type: object
      required: [email, password, fullName]
      properties:
        email:
          type: string
          format: email
          maxLength: 320
        password:
          type: string
          minLength: 8
          maxLength: 72
        fullName:
          type: string
          minLength: 1
          maxLength: 200

    VerifyEmailRequest:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1

    ResendVerificationRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
        rememberMe:
          type: boolean
          default: false

    ForgotPasswordRequest:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    ResetPasswordRequest:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 8
          maxLength: 72

    # ---------------- Story 2.1 requests ----------------
    SetPersonaRequest:
      type: object
      required: [persona]
      properties:
        persona:
          type: string
          enum: [operator, founder, solo_teacher]

    CreateCenterRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        brandColor:
          type: string
          nullable: true
          description: Hex color like `#3B82F6`. Nullable in v1.
        logoUrl:
          type: string
          nullable: true
          description: Presigned R2 asset URL (finalized in a later story). Nullable in v1.

    UpdateCenterProfileRequest:
      type: object
      description: |
        Story 2-5a partial-update — all fields optional. Only present fields
        are applied. `shortCode` is intentionally absent per AC3 (rendered
        read-only in the Settings UI; changing it would break existing
        class codes).

        Tri-state wire semantics per field (D4 code-review 2026-07-15):
        - **Key absent** — column unchanged.
        - **Key present with JSON `null`** — column CLEARED to SQL NULL
          (nullable fields only: `contactEmail`, `brandColor`, `logoUrl`).
          `null` on `name` or `timezone` returns 422 (non-nullable).
        - **Key present with a string value** — column SET to that value.
        - **Empty string (`""`)** is REJECTED with 422 on every field. The
          client MUST send explicit `null` to clear; empty-string had no
          well-defined semantics in v0 and could be persisted as a distinct
          third state from NULL and a real value.

        Bodies larger than 16 KiB return 413 `PAYLOAD_TOO_LARGE`.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        contactEmail:
          type: string
          format: email
          nullable: true
          description: |
            Optional. Persisted to `centers.contact_email`. Used later
            (FU-2-5-G) as reply-to for staff/student notification emails —
            consumption is out of scope for story 2-5a.
        brandColor:
          type: string
          nullable: true
        logoUrl:
          type: string
          nullable: true
        timezone:
          type: string
          description: |
            IANA timezone. MUST be one of the 30-entry whitelist below.
            Anything else returns 422 UNSUPPORTED_TIMEZONE.
          enum:
            - Asia/Ho_Chi_Minh
            - Asia/Bangkok
            - Asia/Singapore
            - Asia/Jakarta
            - Asia/Manila
            - Asia/Kuala_Lumpur
            - Asia/Hong_Kong
            - Asia/Shanghai
            - Asia/Taipei
            - Asia/Seoul
            - Asia/Tokyo
            - Asia/Dubai
            - Asia/Kolkata
            - Asia/Karachi
            - Europe/London
            - Europe/Paris
            - Europe/Berlin
            - Europe/Amsterdam
            - Europe/Madrid
            - Europe/Warsaw
            - Europe/Moscow
            - Europe/Istanbul
            - America/New_York
            - America/Chicago
            - America/Denver
            - America/Los_Angeles
            - America/Toronto
            - America/Sao_Paulo
            - Australia/Sydney
            - Pacific/Auckland

    OnboardingProgressPayload:
      type: object
      description: |
        Typed JSONB payload written to `onboarding_progress.payload`. Story 2.1
        pins `schemaVersion: 1`. `templateDraft` remains opaque JSON until
        story 2.2 pins its shape.
      required: [schemaVersion]
      properties:
        schemaVersion:
          type: integer
          const: 1
        personaChoice:
          type: string
          nullable: true
          enum: [operator, founder, solo_teacher]
        centerDraft:
          type: object
          nullable: true
          required: [name]
          properties:
            name:
              type: string
            brandColor:
              type: string
              nullable: true
            logoUrl:
              type: string
              nullable: true
        templateDraft:
          type: object
          nullable: true
          additionalProperties: true

    PutOnboardingProgressRequest:
      type: object
      required: [currentStep, payload]
      properties:
        currentStep:
          type: string
          enum: [persona, center, template, spawn, solo_first_class, done]
        payload:
          $ref: '#/components/schemas/OnboardingProgressPayload'

    # ---------------- Response bodies (data part only) ----------------
    UserSummary:
      type: object
      required: [id, email, fullName, emailVerified]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        fullName:
          type: string
        emailVerified:
          type: boolean

    RegisterResult:
      type: object
      required: [user, verifyPollId, emailDelivery]
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
        verifyPollId:
          type: string
          format: uuid
        emailDelivery:
          type: string
          enum: [sent, delayed, failed]
          description: |
            `sent` — verification email was enqueued for delivery. `delayed` —
            reserved for future use when a send is genuinely postponed rather
            than dropped. `failed` — the retry queue rejected the job (buffer
            full); no async retry will occur. The frontend should prompt the
            user to hit Resend Verification when it sees `failed`.

    VerifyEmailResult:
      type: object
      required: [verified, email]
      properties:
        verified:
          type: boolean
        email:
          type: string
          format: email

    ResendResult:
      type: object
      required: [verifyPollId]
      properties:
        verifyPollId:
          type: string
          format: uuid
          nullable: true

    VerifyStatusResult:
      type: object
      required: [verified, email]
      properties:
        verified:
          type: boolean
        email:
          type: string
          format: email

    SessionCenter:
      type: object
      required: [id, name, shortCode, brandColor, logoUrl, timezone]
      description: |
        The caller's single-membership center summary, resolved server-side at
        login/refresh time from `center_members` (same single-membership
        heuristic that bakes the JWT `centerId` claim). Mirrors the frontend
        `CenterSummary` cache slice (`Session.center`). Present so a
        center-owning user's `Session.center` survives a full page reload —
        previously it was only populated by the in-session CreateCenter
        response and was lost on the boot-probe refresh (cold cache), which
        misrouted resume-onboarding back to `/setup/center`.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        shortCode:
          type: string
        brandColor:
          type: string
          nullable: true
        logoUrl:
          type: string
          nullable: true
        timezone:
          type: string
          description: Center's timezone in IANA format.

    LoginResult:
      type: object
      required: [accessToken, user, role, center]
      properties:
        accessToken:
          type: string
          description: HS256-signed JWT, 15-minute expiry.
        user:
          $ref: '#/components/schemas/UserSummary'
        role:
          type: string
          enum: [owner, admin, teacher, student]
          nullable: true
          description: |
            Story 2.6 (AC2) — the caller's DB-resolved center_members.role at
            login/refresh time. `null` when the user has no single-membership
            (fresh registration before onboarding OR multi-membership user
            requiring an explicit membership select — deferred to Epic 2+).
            Frontend `Session.role` is populated from this value; `useRole()`
            reads it via the session cache. Parallels the shipped
            `role` field on `AcceptInviteResult` / `CreateCenterResult`.
        center:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SessionCenter'
          description: |
            The caller's owned center summary, or `null` for a user with
            zero-or-multiple memberships (same condition that leaves `role`
            null and the JWT center claim empty). Lets the frontend rehydrate
            `Session.center` on every login AND silent/boot refresh, so a
            reload no longer strands a center-owning user on `/setup/center`.

    LogoutResult:
      type: object
      required: [loggedOut]
      properties:
        loggedOut:
          type: boolean

    ForgotPasswordResult:
      type: object
      required: [sent]
      properties:
        sent:
          type: boolean
          description: Always true on a 200 — does not indicate whether an email was actually dispatched (anti-enumeration).

    ResetPasswordResult:
      type: object
      required: [reset]
      properties:
        reset:
          type: boolean

    # ---------------- Story 2.1 result payloads ----------------
    SetPersonaResult:
      type: object
      required: [persona]
      properties:
        persona:
          type: string
          enum: [operator, founder, solo_teacher]

    CenterProfile:
      type: object
      description: |
        Story 2-5a Settings Profile tab payload. Includes contactEmail (new
        in this story) and googleMeetConnected (existing on the row; used
        by the Integrations tab in 2-5c).
      required:
        - id
        - name
        - shortCode
        - contactEmail
        - brandColor
        - logoUrl
        - timezone
        - googleMeetConnected
        - createdAt
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        shortCode:
          type: string
        contactEmail:
          type: string
          format: email
          nullable: true
        brandColor:
          type: string
          nullable: true
        logoUrl:
          type: string
          nullable: true
        timezone:
          type: string
          description: IANA timezone (see UpdateCenterProfileRequest enum for the accepted set).
        googleMeetConnected:
          type: boolean
        createdAt:
          type: string
          format: date-time

    CreateCenterResult:
      type: object
      required: [id, name, shortCode, brandColor, logoUrl, timezone, role, accessToken, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        shortCode:
          type: string
        brandColor:
          type: string
          nullable: true
        logoUrl:
          type: string
          nullable: true
        timezone:
          type: string
          description: |
            Center's timezone in IANA format. Defaults to `Asia/Ho_Chi_Minh`
            in v1 — story 2.5 exposes edit capability.
        role:
          type: string
          enum: [owner]
          description: v1 always `owner` regardless of persona (see FU-2-1-F).
        accessToken:
          type: string
          description: Fresh HS256 JWT with centerId+role claims, 15-minute TTL.
        expiresAt:
          type: string
          format: date-time
          description: ISO-8601 UTC expiry for the new access token.

    OnboardingProgressResult:
      type: object
      required: [currentStep, payload, updatedAt, persona]
      properties:
        currentStep:
          type: string
          enum: [persona, center, template, spawn, solo_first_class, done]
        payload:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/OnboardingProgressPayload'
        updatedAt:
          type: string
          format: date-time
          nullable: true
        persona:
          type: string
          nullable: true
          enum: [operator, founder, solo_teacher]

    PutOnboardingProgressResult:
      type: object
      required: [currentStep, payload, updatedAt]
      properties:
        currentStep:
          type: string
          enum: [persona, center, template, spawn, solo_first_class, done]
        payload:
          $ref: '#/components/schemas/OnboardingProgressPayload'
        updatedAt:
          type: string
          format: date-time

    # ---------------- Story 2.2 — Templates + Spawning ----------------
    CreateTemplateRequest:
      type: object
      required: [name, targetBand, primarySkill, sessionCount, color, sessions]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
          description: Rune-count limits (`utf8.RuneCountInString`) — a Vietnamese template name of 120 characters is fine even though the UTF-8 byte length exceeds 120.
        targetBand:
          type: number
          minimum: 1.0
          maximum: 9.0
          description: IELTS band target — allowed values 1.0..9.0 in 0.5 steps.
        primarySkill:
          type: string
          enum: [writing, speaking, listening, reading, listening_reading, all_skills]
        sessionCount:
          type: integer
          minimum: 1
          maximum: 100
        color:
          type: string
          nullable: true
        sessions:
          type: array
          minItems: 1
          maxItems: 100
          description: MUST equal length of sessionCount (AC2 single-source-of-truth).
          items:
            $ref: '#/components/schemas/TemplateSessionInput'

    TemplateSessionInput:
      type: object
      required: [title, description]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          nullable: true
        duration:
          type: integer
          nullable: true
          minimum: 5
          maximum: 600
          description: Story 3.3 — optional session length in minutes (5–600). Omitted/null leaves it unset.

    Template:
      type: object
      required: [id, name, targetBand, primarySkill, sessionCount, color, scope, usedCount]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        targetBand:
          type: number
        primarySkill:
          type: string
          enum: [writing, speaking, listening, reading, listening_reading, all_skills]
        sessionCount:
          type: integer
        color:
          type: string
          nullable: true
        scope:
          type: string
          enum: [system, center]
        usedCount:
          type: integer
          description: |
            Story 3.3 — how many of the caller's classes were created from this
            template (`count(*) FROM classes WHERE template_id = <id>`). RLS
            auto-scopes the count to the caller's tenant, so a shared system
            seed reports each tenant's own usage.

    TemplateSession:
      type: object
      required: [id, title, description, sessionOrder, duration]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        sessionOrder:
          type: integer
        duration:
          type: integer
          nullable: true
          minimum: 5
          maximum: 600
          description: Story 3.3 — session length in minutes (5–600), or null when unset.

    ListTemplatesResult:
      type: object
      required: [templates]
      properties:
        templates:
          type: array
          minItems: 5
          description: |
            System seeds + caller's center-owned templates. The response is
            guaranteed to contain at least the 5 system seeds (per AC1b); if
            fewer are found the handler responds `500 SEED_INCOMPLETE`
            rather than a spec-conformant short response. C2-13 review fix
            — the invariant was previously enforced only at runtime.
          items:
            $ref: '#/components/schemas/Template'

    CreateTemplateResult:
      type: object
      required: [id, name, targetBand, primarySkill, sessionCount, color, scope, sessions]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        targetBand:
          type: number
        primarySkill:
          type: string
          enum: [writing, speaking, listening, reading, listening_reading, all_skills]
        sessionCount:
          type: integer
        color:
          type: string
          nullable: true
        scope:
          type: string
          enum: [center]
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/TemplateSession'

    TemplateDetail:
      type: object
      description: |
        Story 3.3 — GET/PUT /api/templates/{id} result. The template scalars +
        usedCount + its ordered session blueprint (each with an optional
        duration). `scope` is "system" for read-only seeds, "center" for
        tenant-owned templates.
      required: [id, name, targetBand, primarySkill, sessionCount, color, scope, usedCount, sessions]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        targetBand:
          type: number
        primarySkill:
          type: string
          enum: [writing, speaking, listening, reading, listening_reading, all_skills]
        sessionCount:
          type: integer
          description: Derived — equals sessions.length. Never a separate input on update.
        color:
          type: string
          nullable: true
        scope:
          type: string
          enum: [system, center]
        usedCount:
          type: integer
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/TemplateSession'

    UpdateTemplateRequest:
      type: object
      description: |
        Story 3.3 — full-replace update (symmetric with CreateTemplateRequest but
        without sessionCount, which is DERIVED = sessions.length). Replaces the
        entire ordered session set; session_order = array index.
      required: [name, targetBand, primarySkill, color, sessions]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        targetBand:
          type: number
          minimum: 1.0
          maximum: 9.0
        primarySkill:
          type: string
          enum: [writing, speaking, listening, reading, listening_reading, all_skills]
        color:
          type: string
          nullable: true
        sessions:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: '#/components/schemas/TemplateSessionInput'

    SpawnClassInput:
      type: object
      required: [cohortName, startDate, teacherEmail]
      properties:
        cohortName:
          type: string
          minLength: 1
          maxLength: 120
        startDate:
          type: string
          format: date
          description: ISO-8601 date (YYYY-MM-DD). Must not be more than 30 days in the past.
        teacherEmail:
          type: string
          format: email
          nullable: true

    SpawnRequest:
      type: object
      required: [classes]
      properties:
        classes:
          type: array
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/SpawnClassInput'

    SpawnedClass:
      type: object
      required: [id, name, startDate, teacherId, teacherEmail, pendingTeacherEmail, teacherStatus, teacherAssignmentReason]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        startDate:
          type: string
          format: date
        teacherId:
          type: string
          format: uuid
          nullable: true
          description: Set for Branches A + B; null for Branches C + D.
        teacherEmail:
          type: string
          format: email
          nullable: true
          description: Set for Branches A + B (from `users.email`); null for Branches C + D — privacy per AC3 (do NOT leak "email exists in system").
        pendingTeacherEmail:
          type: string
          format: email
          nullable: true
          description: Set for Branch C only (from payload, normalized to lowercase); null otherwise.
        teacherStatus:
          type: string
          enum: [assigned, invited, unassigned]
        teacherAssignmentReason:
          type: string
          enum: [explicit_self, explicit_member, founder_auto, invited, unassigned]

    SpawnInviteEntry:
      type: object
      required: [email, classIndices, enqueued, reusedExistingInvite, expiresAt]
      properties:
        email:
          type: string
          format: email
          description: Lowercased invited email.
        classIndices:
          type: array
          items:
            type: integer
            minimum: 0
          description: |
            **0-indexed** payload-order class indices this invite covers.
            Clients rendering "invite N went to <email>" copy MUST convert
            to 1-based for display (C2-06 review fix — spec previously
            didn't specify the indexing base).
        enqueued:
          type: boolean
          description: Return value of `EmailRetryQueue.Enqueue` for newly-created invites; false when reusing an existing invite or when the retry queue buffer is full.
        reusedExistingInvite:
          type: boolean
          description: True when a pre-existing active invite was reused (dedup at DB via `idx_invites_center_email_active`); false when a new row was written this call.
        expiresAt:
          type: string
          format: date-time

    SpawnResult:
      type: object
      required: [classes, invites, invitesSent]
      properties:
        classes:
          type: array
          items:
            $ref: '#/components/schemas/SpawnedClass'
        invites:
          type: array
          items:
            $ref: '#/components/schemas/SpawnInviteEntry'
        invitesSent:
          type: integer
          description: Count of newly-created invite rows that were also enqueued=true (dedup-reused OR buffer-full invites are excluded).

