  # ==================== Story 3.4 — Schedule / Sessions ====================
  # Session CRUD + recurrence + scoped past-immutable mutations. sessionChain =
  # classChain shape (role enforced in-service; teacher-scope → 404, students →
  # 403). Recurrence materializes on create (required endDate + 200 cap). Every
  # mutation carries expectedUpdatedAt (optimistic 409) + applyScope.
  /api/enrollments:
    post:
      operationId: createEnrollment
      summary: Enroll an existing student member into a class (story 3.4.5 — AC2)
      description: |
        Links an existing `student` center-member to a class. Admin/Owner only —
        the role is re-validated from center_members, not trusted from the JWT
        (SEC-1). Validations: the class must resolve in the caller's center; the
        studentId must be a student member of the center (else 422
        NOT_A_STUDENT_MEMBER); and the student must not already be actively
        enrolled (else 409 ALREADY_ENROLLED). Transfer/Withdraw are Story 7.3.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnrollmentRequest'
      responses:
        "201":
          description: Created enrollment (status=active)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeEnrollment'
        "401":
          description: AUTH_REQUIRED / AUTH_INVALID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: INSUFFICIENT_ROLE (Teacher/Student callers — Admin/Owner only)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "404":
          description: CLASS_NOT_FOUND (class not in caller's center)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "409":
          description: ALREADY_ENROLLED (an active enrollment already exists)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "413":
          description: PAYLOAD_TOO_LARGE (body exceeds 16 KiB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "422":
          description: Validation error / NOT_A_STUDENT_MEMBER (studentId is not a student member)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/students/import/preview:
    post:
      operationId: previewStudentImport
      summary: Preview a bulk student import (Story 2.7 — AC2/AC3)
      description: |
        Parses the owner-uploaded CSV/XLSX server-side (read back off R2 by the
        object `key` a prior `/api/uploads/presign` with feature `imports`
        returned) and classifies each row WITHOUT writing anything — advisory.
        Owner/Admin only (RequireRole gate). The tenant-key prefix guard rejects a
        cross-tenant object key with 403 before any download (SEC-8). Confirm is
        the authoritative contract; a preview/confirm divergence is expected.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportPreviewRequest'
      responses:
        "200":
          description: Classified rows + summary tally
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeImportPreview'
        "401":
          description: AUTH_REQUIRED / AUTH_INVALID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: FORBIDDEN (cross-tenant object key) / INSUFFICIENT_ROLE (non owner/admin)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "404":
          description: IMPORT_FILE_NOT_FOUND (object key not found in storage)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "422":
          description: VALIDATION_ERROR (malformed header / unsupported file) or IMPORT_ROW_LIMIT_EXCEEDED (>200 data rows)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/students/import:
    post:
      operationId: confirmStudentImport
      summary: Commit a bulk student import (Story 2.7 — AC4/AC5)
      description: |
        Re-parses + re-classifies the file from scratch (confirm is authoritative)
        and, for each valid row, creates a users record (new emails), upserts a
        `student` center-member, links an active enrollment when a class resolved,
        and enqueues a best-effort invite email for new users — all inside ONE
        tenant transaction. Owner/Admin only, re-validated from center_members
        (SEC-1). Partial success is the contract: valid rows persist within a
        committed tx and the result lists failed rows with reasons. A commit/audit
        failure is a full rollback (naturally idempotent on retry).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImportConfirmRequest'
      responses:
        "200":
          description: Per-row outcome + counts (partial success possible)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeImportResult'
        "401":
          description: AUTH_REQUIRED / AUTH_INVALID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: FORBIDDEN (cross-tenant object key) / INSUFFICIENT_ROLE (DB role re-validated)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "404":
          description: IMPORT_FILE_NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "422":
          description: VALIDATION_ERROR (malformed header / unsupported file) or IMPORT_ROW_LIMIT_EXCEEDED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

