  /api/submissions/{submissionId}/ai-grade:
    post:
      operationId: enqueueAIWritingGrade
      summary: >-
        Enqueue an AI Writing-grade job for a submission — 202 + jobId; deducts 1
        credit in the SAME tx; never calls Gemini synchronously (story 6.2a — AC1).
        The worker produces reviewable SUGGESTIONS in job.result (AIWritingGradeResult),
        never a grade — the teacher reviews in 6.2b and commits via POST
        /api/submissions/{submissionId}/grade (D1). submissionId comes from the PATH;
        any client-supplied centerId is ignored (SEC-7 — the job-row center_id is the
        sole trust anchor, R3). Teacher-of-class authz is enforced in the service BEFORE
        the job insert (D9). Enqueue is idempotent (D6): a 2nd call while an
        ai_grade_writing job for this submission is pending/processing returns the
        EXISTING in-flight job (200) with no second job and no second -1 deduct. Refund
        on terminal failure is automatic; there is NO 402 balance gate (Story 6.5).
      security:
        - bearerAuth: []
      parameters:
        - name: submissionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "202":
          description: AI grade job enqueued (poll GET /api/jobs/{jobId}; reopening the grading read rehydrates the latest suggestion via TeacherGradingView.aiSuggestion).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeJobEnqueued'
        "200":
          description: An ai_grade_writing job for this submission is already in flight (pending/processing) — the existing job id is returned, no new job and no second deduct (D6 idempotency).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeJobEnqueued'
        "401":
          description: AUTH_REQUIRED / AUTH_INVALID
          content:
            application/json:
              schema:
