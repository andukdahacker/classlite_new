  /api/templates/{id}/spawn:
    post:
      operationId: spawnClasses
      summary: Spawn N classes atomically from a template (story 2.2)
      description: |
        Reads the template (system OR own — RLS renders other tenants' rows
        invisible → 404 TEMPLATE_NOT_FOUND) then, in ONE transaction, inserts
        N `classes` rows, resolves each class's teacher via Branch A/B/C/D,
        writes optional `invites` rows for pending teachers, and writes one
        `audit_logs` row `class.spawned` per class. On ANY failure the whole
        tx rolls back — zero classes, zero invites, zero audit rows. Invite
        emails are enqueued AFTER commit through `EmailRetryQueue`
        (best-effort — the invite ROW is the durable contract).
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SpawnRequest'
      responses:
        "201":
          description: All classes spawned atomically
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeSpawnResult'
        "401":
          description: Missing (AUTH_REQUIRED) or invalid (AUTH_INVALID) access token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: Email not verified (EMAIL_VERIFICATION_REQUIRED), caller has no center yet (CENTER_REQUIRED), tenant claim on JWT invalid (INVALID_TENANT_CLAIM), or generic forbidden (FORBIDDEN)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "404":
          description: Template does not exist or is invisible to caller (TEMPLATE_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "422":
          description: |
            Validation failure (VALIDATION_ERROR at envelope level). `error.details[*].code` may include: `INVALID_TEACHER_EMAIL`, `SELF_INVITE_BLOCKED`. Other field-level codes are empty (`""`) and rely on `error.details[*].field` + `error.details[*].message` for surfacing (cohortName length, startDate drift, class count, malformed JSON). C2-08 review fix — the enumeration is not exhaustive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "429":
          description: Rate limit exceeded (spawnLimit 5/min IP + onboardingLimit 20/min IP)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "500":
          description: Unexpected server error (INTERNAL_ERROR)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

