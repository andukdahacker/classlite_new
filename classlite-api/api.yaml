    # ---------------- Story 3.4.5 — Enrollment linkage ----------------
    EnrollmentStatus:
      type: string
      # 3.4.5 only ever writes 'active'; withdrawn/transferred arrive in 7.3.
      enum: [active, withdrawn, transferred]

    Enrollment:
      type: object
      # All fields present + explicit (nulls not omitted) per GO-5. studentName +
      # studentEmail are denormalized from the users JOIN so the roster renders
      # without a second call.
      required:
        - id
        - centerId
        - studentId
        - classId
        - studentName
        - studentEmail
        - enrolledAt
        - withdrawnAt
        - status
      properties:
        id:
          type: string
          format: uuid
        centerId:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        classId:
          type: string
          format: uuid
        studentName:
          type: string
        studentEmail:
          type: string
        enrolledAt:
          type: string
          format: date-time
        withdrawnAt:
          type: string
          format: date-time
          nullable: true
        status:
          $ref: '#/components/schemas/EnrollmentStatus'

    CreateEnrollmentRequest:
      type: object
      required: [studentId, classId]
      properties:
        studentId:
          type: string
          format: uuid
        classId:
          type: string
          format: uuid

    EnvelopeEnrollment:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/Enrollment'
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'

    EnvelopeEnrollmentList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Enrollment'
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'

    # ---------------- Story 2.7 — Bulk student import ----------------
    ImportRowStatus:
      type: string
      description: |
        Per-row classification. `unassigned` = importable but classless (the
        preview warns the student is not yet in any class); `validation_error` =
        the row is skipped on confirm.
      enum: [new_user, existing_user, validation_error, unassigned]

    ImportPreviewRequest:
      type: object
      required: [key]
      properties:
        key:
          type: string
          description: The R2 object key returned by /api/uploads/presign (feature `imports`).

    ImportConfirmRequest:
      type: object
      required: [key, importId]
      properties:
        key:
          type: string
        importId:
          type: string
          format: uuid
          description: Client-generated correlation id (audit + logs only; no dedup table).

    ImportPreviewRow:
      type: object
      # All fields explicit (GO-5). `error` is "" when the row is valid.
      required: [rowNumber, email, fullName, className, status, error]
      properties:
        rowNumber:
          type: integer
        email:
          type: string
        fullName:
          type: string
        className:
          type: string
        status:
          $ref: '#/components/schemas/ImportRowStatus'
        error:
          type: string
          description: UPPER_SNAKE_CASE row error code, or "" for a valid row.

    ImportSummary:
      type: object
      required: [total, willImport, willSkip, unassigned]
      properties:
        total:
          type: integer
        willImport:
          type: integer
        willSkip:
          type: integer
        unassigned:
          type: integer

    ImportPreview:
      type: object
      required: [rows, summary]
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ImportPreviewRow'
        summary:
          $ref: '#/components/schemas/ImportSummary'

    ImportResultRow:
      type: object
      required: [rowNumber, email, status, persisted, error]
      properties:
        rowNumber:
          type: integer
        email:
          type: string
        status:
          $ref: '#/components/schemas/ImportRowStatus'
        persisted:
          type: boolean
        error:
          type: string

    ImportResult:
      type: object
      required: [rows, created, invitesSent, failed]
      properties:
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ImportResultRow'
        created:
          type: integer
        invitesSent:
          type: boolean
          description: |
            True if every new-user invite email was successfully enqueued — and
            vacuously true when there were no invites to send (all-existing or
            all-unassigned import). False (surfaced + logged) only when the
            best-effort queue actually dropped one or more.
        failed:
          type: integer

    EnvelopeImportPreview:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/ImportPreview'
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'

    EnvelopeImportResult:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/ImportResult'
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'

    # ---------------- Error envelope ----------------
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        code:
          type: string
          description: |
            Optional per-field UPPER_SNAKE_CASE identifier (e.g.
            INVALID_TEACHER_EMAIL, SELF_INVITE_BLOCKED) — populated for
            error-catalog fields; empty string OR omitted when the error
            carries only a prose message. Story 1.x handlers pre-date the
            catalog and emit `""` for `code`; Story 2.2+ handlers populate
            it where the wizard router needs to key on the field-level
            code. C2-03 review fix — was `required` under Story 2.2's
            initial pass, which broke JSON-Schema validators for pre-2.2
            envelopes that didn't emit the key.
        message:
          type: string

    ErrorBody:
      type: object
      required: [code, message, requestId, details]
      properties:
        code:
          type: string
          description: UPPER_SNAKE_CASE error code (e.g., VALIDATION_ERROR, EMAIL_ALREADY_REGISTERED, VERIFICATION_TOKEN_EXPIRED).
        message:
          type: string
        requestId:
          type: string
        details:
          oneOf:
            - type: 'null'
            - type: array
              items:
                $ref: '#/components/schemas/FieldError'

    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          $ref: '#/components/schemas/ErrorBody'

    # ---------------- Story 1.6 — Google OAuth + Invite Acceptance + Force-Logout ----------------
    AcceptInviteRequest:
      type: object
      required: [inviteToken]
      properties:
        inviteToken:
          type: string
          minLength: 1
          maxLength: 256
        fullName:
          type: string
          minLength: 1
          maxLength: 200
          nullable: true
          description: Required only on the new-user branch.
        password:
          type: string
          minLength: 8
          maxLength: 72
          nullable: true
          description: Required only on the new-user branch.

    InviteCenter:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string

    AcceptInviteResult:
      type: object
      required: [accessToken, user, center, role]
      properties:
        accessToken:
          type: string
        user:
          $ref: '#/components/schemas/UserSummary'
        center:
          $ref: '#/components/schemas/InviteCenter'
        role:
          type: string
          enum: [owner, admin, teacher, student]

    EnvelopeAcceptInviteResult:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/AcceptInviteResult'

    ForceLogoutResult:
      type: object
      required: [forcedLogout, sessionsRevoked]
      properties:
        forcedLogout:
          type: boolean
        sessionsRevoked:
          type: integer
          minimum: 0
          description: Number of refresh_tokens rows deleted for the target.

    EnvelopeForceLogoutResult:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/ForceLogoutResult'

    # Detail payloads echoed in invite error envelopes.
    InviteExpiredDetails:
      type: object
      required: [centerName, inviterEmail]
      properties:
        centerName:
          type: string
        inviterEmail:
          type: string
          format: email

    InviteAlreadyAcceptedDetails:
      type: object
      required: [centerName]
      properties:
        centerName:
          type: string

    InviteEmailMismatchDetails:
      type: object
      required: [invitedEmail, oauthEmail]
      properties:
        invitedEmail:
          type: string
          format: email
        oauthEmail:
          type: string
          format: email

    # ---------------- Story 2-5c — Google Meet OAuth integration ----------------

    GoogleMeetAuthorizeResult:
      type: object
      required: [authorizeUrl, expiresAt]
      properties:
        authorizeUrl:
          type: string
          description: |
            Google's OAuth 2.0 authorize URL with signed state token
            embedded. The client must navigate the browser to this URL
            via `window.location.assign` — do NOT fetch it programmatically.
        expiresAt:
          type: string
          format: date-time
          description: |
            UTC timestamp when the signed state token expires (10 min from
            issue). If the Owner does not complete the Google consent
            screen before this time, the callback returns 400
            OAUTH_STATE_EXPIRED and the SPA must call authorize again.

    EnvelopeGoogleMeetAuthorizeResult:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/GoogleMeetAuthorizeResult'
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'

    # ---------------- Story 2.6 — Owner/Admin staff invite ----------------
    InviteStaffRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: |
            Recipient email. Case-insensitive on the duplicate-invite check
            (matches accept-invite's email_norm semantics from Story 1.5).
        role:
          type: string
          enum: [owner, admin, teacher]
          description: |
            Assigned role. Student is NOT a valid value — staff invites are
            distinct from student enrollment (the latter goes through the
            enrollment endpoints, Story 2.7 / Epic 7). FR-11 forbids Admin
            callers from picking `owner` here — the service returns 403
            ROLE_ASSIGNMENT_FORBIDDEN in that case.

    InviteResult:
      type: object
      required: [id, email, role, expiresAt]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        role:
          type: string
          enum: [owner, admin, teacher]
        expiresAt:
          type: string
          format: date-time
          description: |
            UTC timestamp when the invite lapses. Fixed 7 days from creation
            for the Story 2.6 shipping path (Epic 7 may parameterize).

    EnvelopeInviteResult:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/InviteResult'

    # ---------------- Story 4.1 — Exercise library ----------------
    ExerciseSkill:
      type: string
      enum: [reading, listening, writing, speaking, grammar, vocabulary, general]

    # --- Story 4.2 — v1 exercise-content sub-schema -------------------------
    # The typed shape of the JSONB `content` blob (was opaque at 4.1). ONE
    # physical shape stamped schema_version=1. All fields required + explicit
    # (GO-5) — content is a nested document, not a partial patch. The server
    # enforces the per-type semantic invariants (ValidateExerciseContent, AC7);
    # these schemas pin the wire STRUCTURE + the enumerated type vocabularies.

    ExerciseSectionType:
      type: string
      # AC7 5-set — the editor's five section cards. `vocabulary`/`general` are
      # exercise-level skill facets, NOT section types (a section type is
      # independent of the exercise skill — 4.1 Dev Note #8).
      enum: [reading, listening, writing, speaking, grammar]

    QuestionGroupType:
      type: string
      enum: [multiple_choice, true_false_not_given, fill_in_blank, short_answer, matching]

    ExerciseQuestion:
      type: object
      required: [text, type, options, correctAnswer, acceptedVariants]
      properties:
        text:
          type: string
        type:
          type: string
          description: Per-question type discriminant, mirroring the parent group type (e.g. "multiple_choice"/"true_false_not_given", matching the golden fixture). Redundant with the group type and NOT read by the validator — grading semantics key off the parent group type.
        options:
          type: array
          items:
            type: string
          description: Choice list (MCQ) or the replicated heading bank (Matching). Empty for gap-fill / short-answer / T-F-NG.
        correctAnswer:
          type: string
          description: The answer key. For T/F/NG ∈ {true,false,notGiven}; for MCQ/Matching ∈ options; for gap-fill/short-answer the primary accepted string.
        acceptedVariants:
          type: array
          items:
            type: string
          description: Alternate accepted answers (gap-fill / short-answer). Empty otherwise.

    QuestionGroup:
      type: object
      required: [type, instructions, questions]
      properties:
        type:
          $ref: '#/components/schemas/QuestionGroupType'
        instructions:
          type: string
        questions:
          type: array
          items:
            $ref: '#/components/schemas/ExerciseQuestion'

    ExerciseSection:
      type: object
      required: [type, title, content, questionGroups]
      properties:
        type:
          $ref: '#/components/schemas/ExerciseSectionType'
        title:
          type: string
        content:
          type: string
          description: Passage / prompt / stimulus / audio-URL text for the section.
        questionGroups:
          type: array
          items:
            $ref: '#/components/schemas/QuestionGroup'
          description: Empty for prompt-only (writing/speaking) sections — server-enforced (AC7).

    ExerciseSettings:
      type: object
      required: [timeLimitEnabled, timeLimitMinutes, caseSensitive]
      # Every FR-22 default coincides with the type's zero value (time-limit
      # OFF, 0 minutes, case-INsensitive). Hyphen/whitespace normalization is
      # fixed always-on grading behavior (Epic 5), NOT a settings toggle.
      properties:
        timeLimitEnabled:
          type: boolean
        timeLimitMinutes:
          type: integer
          minimum: 0
        caseSensitive:
          type: boolean

    ExerciseContent:
      type: object
      required: [sections, settings]
      properties:
        sections:
          type: array
          items:
            $ref: '#/components/schemas/ExerciseSection'
        settings:
          $ref: '#/components/schemas/ExerciseSettings'

    Exercise:
      type: object
      # All fields required + explicit (nulls not omitted) per GO-5. `content` is
      # an opaque object at 4.1 (Story 4.2 fleshes out sections/groups/questions/
      # settings); `schemaVersion` is server-authoritative + column-canonical.
      required:
        - id
        - centerId
        - createdBy
        - code
        - title
        - description
        - skill
        - tags
        - targetBand
        - schemaVersion
        - sectionCount
        - questionCount
        - content
        - locked
        - lockReason
        - lockedBy
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        centerId:
          type: string
          format: uuid
        createdBy:
          type: string
          format: uuid
        code:
          type: string
          description: Server-generated, immutable EX-<SkillLetter><NNN> (locale-invariant).
        title:
          type: string
        description:
          type: string
          nullable: true
        skill:
          $ref: '#/components/schemas/ExerciseSkill'
        tags:
          type: array
          items:
            type: string
        targetBand:
          type: number
          nullable: true
        schemaVersion:
          type: integer
          description: Server-authoritative content schema version. The request body cannot set or override it.
        sectionCount:
          type: integer
        questionCount:
          type: integer
        content:
          $ref: '#/components/schemas/ExerciseContent'
        locked:
          type: boolean
          description: >-
            FR-23 (AC15/16). True once >= 1 submission exists against any
            assignment on this exercise; content edits + delete then 409
            EXERCISE_LOCKED. Clone (POST /duplicate) is the sanctioned edit path.
        lockReason:
          allOf:
            - $ref: '#/components/schemas/ExerciseLockReason'
          nullable: true
          description: Null when unlocked.
        lockedBy:
          type: array
          items:
            $ref: '#/components/schemas/ExerciseLock'
          description: >-
            Detail-only (AC16/D9). Which assignments block edits + a representative
            attempt state, so the read-only editor strip can explain why. Empty
            when unlocked.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ExerciseListItem:
      type: object
      # The list item omits the `content` blob (never transferred on the list
      # path — Winston #2) but carries the SQL-computed section/question counts.
      required:
        - id
        - centerId
        - createdBy
        - code
        - title
        - description
        - skill
        - tags
        - targetBand
        - schemaVersion
        - sectionCount
        - questionCount
        - locked
        - lockReason
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        centerId:
          type: string
          format: uuid
        createdBy:
          type: string
          format: uuid
        code:
          type: string
        title:
          type: string
        description:
          type: string
          nullable: true
        skill:
          $ref: '#/components/schemas/ExerciseSkill'
        tags:
          type: array
          items:
            type: string
        targetBand:
          type: number
          nullable: true
        schemaVersion:
          type: integer
        sectionCount:
          type: integer
        questionCount:
          type: integer
        locked:
          type: boolean
          description: FR-23 (AC16). Cheap list-path lock flag; lockedBy detail is GET-single only.
        lockReason:
          allOf:
            - $ref: '#/components/schemas/ExerciseLockReason'
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateExerciseRequest:
      type: object
      # title + skill required. NO schemaVersion / code fields — both are
      # server-set (AC3). content is NOT accepted at create (server materializes
      # the FR-22-default shell).
      required: [title, skill]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        skill:
          $ref: '#/components/schemas/ExerciseSkill'
        tags:
          type: array
          items:
            type: string
          nullable: true
        description:
          type: string
          nullable: true
        targetBand:
          type: number
          minimum: 0
          maximum: 9
          nullable: true

    UpdateExerciseRequest:
      type: object
      # Metadata edits (4.1 UI) + a full `content` replacement (4.2/Duplicate).
      # schemaVersion + code are NEVER accepted — the server ignores/rejects them.
      # updatedAt is the optimistic-concurrency precondition fallback when the
      # If-Match header is absent.
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        skill:
          $ref: '#/components/schemas/ExerciseSkill'
        tags:
          type: array
          items:
            type: string
          nullable: true
        description:
          type: string
          nullable: true
        targetBand:
          type: number
          minimum: 0
          maximum: 9
          nullable: true
        content:
          allOf:
            - $ref: '#/components/schemas/ExerciseContent'
          nullable: true
          description: Full-replace v1 content object. Absent = keep the stored blob.
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: Optimistic-concurrency precondition (fallback to the If-Match header).

    PaginationMeta:
      type: object
      required: [page, pageSize, total, totalPages]
      properties:
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
        totalPages:
          type: integer

    SkillCount:
      type: object
      required: [skill, count]
      properties:
        skill:
          $ref: '#/components/schemas/ExerciseSkill'
        count:
          type: integer

    EnvelopeMetaPaginated:
      type: object
      required: [serverTime, pagination, skillCounts]
      properties:
        serverTime:
          type: string
          format: date-time
        pagination:
          $ref: '#/components/schemas/PaginationMeta'
        skillCounts:
          type: array
          items:
            $ref: '#/components/schemas/SkillCount'
          description: Per-skill totals for the count-tab strip (honors the active tag/band filters; ignores the skill filter).

    EnvelopeExercise:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/Exercise'
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'

    EnvelopeExerciseList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/ExerciseListItem'
        meta:
          $ref: '#/components/schemas/EnvelopeMetaPaginated'

    # ---------------- Story 5.1 — FR-23 exercise lock payload ----------------
    ExerciseLockReason:
      type: string
      # Single reason in v1: the exercise has >= 1 submission (any status) against
      # some assignment. "unfinalize" was struck from FR-23 (D5) — clone-only.
      enum: [has_submissions]

    ExerciseLock:
      type: object
      # One entry per assignment that blocks edits (AC16/D9). attemptState is a
      # representative status ('in_progress' if any attempt is in-flight, else
      # 'submitted') so the read-only strip can say which classes block + why.
      required: [assignmentId, className, attemptState]
      properties:
        assignmentId:
          type: string
          format: uuid
        className:
          type: string
        attemptState:
          $ref: '#/components/schemas/SubmissionStatus'

    # ---------------- Story 5.1 — Assignments ----------------
    AssignmentStatus:
      type: string
      # 5.1 writes open/closed only; archived deferred (D4).
      enum: [open, closed]

    Assignment:
      type: object
      # All fields present + explicit (nulls not omitted) per GO-5.
      required:
        - id
        - centerId
        - exerciseId
        - classId
        - createdBy
        - status
        - deadlineAt
        - hardDeadlineAt
        - instructions
        - latePenalty
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        centerId:
          type: string
          format: uuid
        exerciseId:
          type: string
          format: uuid
        classId:
          type: string
          format: uuid
        createdBy:
          type: string
          format: uuid
          nullable: true
        status:
          $ref: '#/components/schemas/AssignmentStatus'
        deadlineAt:
          type: string
          format: date-time
        hardDeadlineAt:
          type: string
          format: date-time
          nullable: true
        instructions:
          type: string
          nullable: true
        latePenalty:
          type: number
          description: Flat late penalty snapshotted onto a late submission (D1). >= 0.
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateAssignmentRequest:
      type: object
      required: [exerciseId, classId, deadlineAt]
      properties:
        exerciseId:
          type: string
          format: uuid
        classId:
          type: string
          format: uuid
        deadlineAt:
          type: string
          format: date-time
        hardDeadlineAt:
          type: string
          format: date-time
          nullable: true
        instructions:
          type: string
          nullable: true
        latePenalty:
          type: number
          minimum: 0
          maximum: 99.9
          nullable: true
          description: Defaults to 0 when absent/null. Max 99.9 (numeric(3,1) ceiling).

    UpdateAssignmentRequest:
      type: object
      # 5.1 exposes only the status flip (close/reopen). Deadline edits are out of
      # scope (D11). status is the compare-and-swap target.
      required: [status]
      properties:
        status:
          $ref: '#/components/schemas/AssignmentStatus'

    EnvelopeAssignment:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/Assignment'
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'

    EnvelopeMetaListPaginated:
      type: object
      required: [serverTime, pagination]
      properties:
        serverTime:
          type: string
          format: date-time
        pagination:
          $ref: '#/components/schemas/PaginationMeta'

    EnvelopeAssignmentList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Assignment'
        meta:
          $ref: '#/components/schemas/EnvelopeMetaListPaginated'

    # ---------------- Story 5.1 — Submissions ----------------
    SubmissionStatus:
      type: string
      # 5.1 drives in_progress → submitted only; ai_processing/graded are
      # provisioned for Epic 6 (no 5.1 lifecycle path reaches them — AC14).
      enum: [in_progress, submitted, ai_processing, graded]

    SubmissionContent:
      type: object
      # Opaque v1 attempt payload — shape owned by the attempt UIs (5.2–5.4). 5.1
      # treats it as a pass-through JSONB blob (empty passthrough ladder, AC19).
      additionalProperties: true

    Submission:
      type: object
      # All fields present + explicit (nulls not omitted) per GO-5.
      required:
        - id
        - centerId
        - assignmentId
        - studentId
        - status
        - isLate
        - appliedPenalty
        - startedAt
        - submittedAt
        - timeBudgetSeconds
        - schemaVersion
        - content
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        centerId:
          type: string
          format: uuid
        assignmentId:
          type: string
          format: uuid
        studentId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/SubmissionStatus'
        isLate:
          type: boolean
        appliedPenalty:
          type: number
          description: Point-in-time late-penalty snapshot (0 when on-time). Immutable after submit (AC12).
        startedAt:
          type: string
          format: date-time
          description: Server-authoritative attempt start; set once, never reset on resume.
        submittedAt:
          type: string
          format: date-time
          nullable: true
        timeBudgetSeconds:
          type: integer
          nullable: true
          description: >-
            Total allotted time budget (seconds) from the exercise time limit (AC10);
            NOT decremented on resume. Null for untimed exercises. Clients render the
            remaining timer from this + startedAt vs. serverTime.
        schemaVersion:
          type: integer
        content:
          $ref: '#/components/schemas/SubmissionContent'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateSubmissionRequest:
      type: object
      required: [assignmentId]
      properties:
        assignmentId:
          type: string
          format: uuid

    SaveSubmissionProgressRequest:
      type: object
      required: [content]
      properties:
        content:
          $ref: '#/components/schemas/SubmissionContent'

    EnvelopeSubmission:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/Submission'
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'

    # ---------------- Story 5.2a — Student attempt-read surface ----------------
    # The answer-STRIPPED mirror of the ExerciseContent sub-schemas above. These
    # are DISTINCT types that do NOT declare correctAnswer / acceptedVariants at
    # all (D1 — structural omission, not a runtime filter). A future field added to
    # ExerciseQuestion is hidden by default because the mapper whitelists field by
    # field (AC10). All fields required + explicit (GO-5); no omitempty.

    AttemptQuestion:
      type: object
      # Student-visible question surface. NO correctAnswer, NO acceptedVariants —
      # the answer key is structurally absent from this type (AC10,11).
      required: [text, type, options]
      properties:
        text:
          type: string
        type:
          type: string
          description: Per-question type discriminant mirroring the parent group type (e.g. "multiple_choice").
        options:
          type: array
          items:
            type: string
          description: Choice list (MCQ) or the replicated heading bank (Matching) — student-visible. Empty for gap-fill / short-answer / T-F-NG.

    AttemptQuestionGroup:
      type: object
      required: [type, instructions, questions]
      properties:
        type:
          $ref: '#/components/schemas/QuestionGroupType'
        instructions:
          type: string
        questions:
          type: array
          items:
            $ref: '#/components/schemas/AttemptQuestion'

    AttemptSection:
      type: object
      required: [type, title, content, questionGroups]
      properties:
        type:
          $ref: '#/components/schemas/ExerciseSectionType'
        title:
          type: string
        content:
          type: string
          description: Passage / prompt / stimulus / audio-URL text for the section (student-visible).
        questionGroups:
          type: array
          items:
            $ref: '#/components/schemas/AttemptQuestionGroup'
          description: Empty for prompt-only (writing/speaking) sections — round-tripped intact so 5.3/5.4 read the prompt from content.

    AttemptExercise:
      type: object
      # The answer-stripped exercise the attempt UIs render. Skill-agnostic — the
      # mapper strips answers uniformly and preserves section/group ordering (AC12).
      required: [id, title, skill, sections, settings]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        skill:
          $ref: '#/components/schemas/ExerciseSkill'
        sections:
          type: array
          items:
            $ref: '#/components/schemas/AttemptSection'
        settings:
          $ref: '#/components/schemas/ExerciseSettings'

    StudentAssignmentView:
      type: object
      # AC7 whitelist — the student-safe subset of Assignment. OMITS centerId and
      # createdBy (internal). latePenalty IS included (the s63 late-warning banner
      # needs it). All fields present + explicit nulls (GO-5); no omitempty.
      required:
        - id
        - exerciseId
        - classId
        - status
        - deadlineAt
        - hardDeadlineAt
        - instructions
        - latePenalty
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        exerciseId:
          type: string
          format: uuid
        classId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AssignmentStatus'
        deadlineAt:
          type: string
          format: date-time
        hardDeadlineAt:
          type: string
          format: date-time
          nullable: true
        instructions:
          type: string
          nullable: true
        latePenalty:
          type: number
          description: Flat late penalty (D1). >= 0. Powers the late-warning banner (s63).
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    StudentAssignmentListItem:
      type: object
      # A StudentAssignmentView plus the exercise header + the caller's own
      # submission summary (AC2). submissionId/submissionStatus are null when the
      # student has not started the attempt. Fields inlined (not composed) so the
      # wire shape is unambiguous for codegen.
      required:
        - id
        - exerciseId
        - classId
        - status
        - deadlineAt
        - hardDeadlineAt
        - instructions
        - latePenalty
        - createdAt
        - updatedAt
        - exerciseTitle
        - exerciseSkill
        - submissionId
        - submissionStatus
      properties:
        id:
          type: string
          format: uuid
        exerciseId:
          type: string
          format: uuid
        classId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/AssignmentStatus'
        deadlineAt:
          type: string
          format: date-time
        hardDeadlineAt:
          type: string
          format: date-time
          nullable: true
        instructions:
          type: string
          nullable: true
        latePenalty:
          type: number
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        exerciseTitle:
          type: string
        exerciseSkill:
          $ref: '#/components/schemas/ExerciseSkill'
        submissionId:
          type: string
          format: uuid
          nullable: true
          description: The caller's own submission id, or null if not started.
        submissionStatus:
          # Nullable $ref to the canonical SubmissionStatus (allOf wrapper is the
          # OpenAPI 3.0 idiom for nullable + $ref) — no inline enum copy to drift.
          description: The caller's own submission status, or null if not started.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/SubmissionStatus'

    AttemptBundle:
      type: object
      # The single payload the attempt UIs (5.2b/5.3/5.4) consume: the student's
      # own submission + the student-safe assignment subset + the answer-stripped
      # exercise. Assembled read-only in one tenant tx.
      required: [submission, assignment, exercise]
      properties:
        submission:
          $ref: '#/components/schemas/Submission'
        assignment:
          $ref: '#/components/schemas/StudentAssignmentView'
        exercise:
          $ref: '#/components/schemas/AttemptExercise'

    EnvelopeAttemptBundle:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/AttemptBundle'
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'

    EnvelopeStudentAssignmentList:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/StudentAssignmentListItem'
        meta:
          $ref: '#/components/schemas/EnvelopeMetaListPaginated'

    # ---------------- Story 5.5a — submission review (pre-grade read-back) ----------------
    StudentSubmissionResult:
      type: object
      # The "review my submission" payload (story 5.5a; grade block added 6.1).
      # Assignment-keyed read of the caller's OWN terminal submission: the full
      # Submission (own answers), the student-safe assignment subset, and the
      # answer-stripped AttemptExercise.
      # released flips true IFF the latest grade version has released_at IS NOT NULL
      # (D1 — NOT off submission.status, or 6.4's stored-then-released breaks it).
      # grade is the StudentGradeView when released (excludes graded_by teacher
      # identity — privacy), else null. 6.1 adds only this backend data; 5.5b renders
      # it + owns the /result FE route + s79.
      # inProgress=true short-circuits to a resume CTA (exercise + audioUrl null, no
      # strip, no presign — D10). audioUrl is a fresh 5-min presigned GET for a
      # speaking submission's recording, or null (non-speaking / nil audioKey / CTA).
      # All fields present + explicit nulls (GO-5); no omitempty.
      required: [submission, assignment, exercise, released, grade, audioUrl, inProgress]
      properties:
        submission:
          $ref: '#/components/schemas/Submission'
        assignment:
          $ref: '#/components/schemas/StudentAssignmentView'
        exercise:
          description: The answer-stripped exercise; null when inProgress (resume CTA short-circuit — D10).
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AttemptExercise'
        released:
          type: boolean
          description: Grade release flag — true IFF the latest grade version has released_at IS NOT NULL (D1).
        grade:
          description: The released grade (student-safe, no teacher identity), or null when not released.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/StudentGradeView'
        audioUrl:
          type: string
          nullable: true
          description: Fresh 5-min presigned GET for a speaking recording, or null (non-speaking / nil key / in_progress).
        inProgress:
          type: boolean
          description: True → the submission is not terminal; render the resume-attempt CTA (D10).

    EnvelopeStudentSubmissionResult:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/StudentSubmissionResult'
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'

    # ---- Story 6.1: Writing grading (keystone — inherited by 5.5b/6.2/6.3/6.4) ----

    CriterionScores:
      type: object
      # The four IELTS Writing criterion band scores. Each is 1.0–9.0 on a 0.5 grid
      # (validated server-side, AC5). All four keys are REQUIRED. camelCase keys map
      # to the criterion_scores JSONB.
      required: [taskResponse, coherenceCohesion, lexicalResource, grammaticalRange]
      properties:
        taskResponse:
          type: number
          description: Task Response band (1.0–9.0, 0.5 grid).
        coherenceCohesion:
          type: number
          description: Coherence & Cohesion band (1.0–9.0, 0.5 grid).
        lexicalResource:
          type: number
          description: Lexical Resource band (1.0–9.0, 0.5 grid).
        grammaticalRange:
          type: number
          description: Grammatical Range & Accuracy band (1.0–9.0, 0.5 grid).

    AnchoredComment:
      type: object
      # A teacher comment pinned to a span of the student's essay (or the whole
      # essay). anchorStart/anchorEnd are UTF-16 CODE-UNIT offsets into
      # submission.content.text (D3 — matches the browser that produces and consumes
      # them); a span comment has 0 <= start < end <= utf16Len(text) after trimming
      # trailing whitespace/newlines; a whole-essay comment has BOTH null.
      # Out-of-range anchors are demoted to whole-essay (null/null), never dropped.
      # text is teacher-authored free text — escaped on render (XSS), never trusted
      # as HTML. This shape is inherited by 6.2/6.3/5.5b.
      required: [type, criterion, anchorStart, anchorEnd, text]
      properties:
        type:
          type: string
          enum: [error, praise, suggestion]
        criterion:
          type: string
          enum: [taskResponse, coherenceCohesion, lexicalResource, grammaticalRange]
        anchorStart:
          type: integer
          nullable: true
          description: UTF-16 code-unit start offset into content.text, or null for a whole-essay comment.
        anchorEnd:
          type: integer
          nullable: true
          description: UTF-16 code-unit end offset (exclusive) into content.text, or null for a whole-essay comment.
        text:
          type: string

    GradeInput:
      type: object
      # The grade write body (AC4). overallBand is NOT a request field — the server
      # computes it (AC7); bodies are strictly decoded, so sending overallBand (or any
      # unknown field) is rejected with 422. feedback is nullable teacher free text.
      required: [criterionScores, comments, feedback]
      properties:
        criterionScores:
          $ref: '#/components/schemas/CriterionScores'
        comments:
          type: array
          items:
            $ref: '#/components/schemas/AnchoredComment'
        feedback:
          type: string
          nullable: true

    ReviseGradeInput:
      type: object
      # The revise body (AC6) — GradeInput + a required reason (audited).
      required: [criterionScores, comments, feedback, reason]
      properties:
        criterionScores:
          $ref: '#/components/schemas/CriterionScores'
        comments:
          type: array
          items:
            $ref: '#/components/schemas/AnchoredComment'
        feedback:
          type: string
          nullable: true
        reason:
          type: string
          description: Why the grade is being revised (audited as grade.revised).

    Grade:
      type: object
      # The teacher-facing grade wire (AC4 response). overallBand is server-computed
      # (IELTS half-rounding). releasedAt is set on release (Writing 6.1); gradedBy
      # is the teacher's id (teacher view only — the student StudentGradeView omits
      # it). All fields present + explicit nulls (GO-5).
      required: [id, submissionId, version, criterionScores, overallBand, comments, feedback, gradedBy, releasedAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        submissionId:
          type: string
          format: uuid
        version:
          type: integer
          description: Grade version (1 for the initial grade, N+1 per revision).
        criterionScores:
          $ref: '#/components/schemas/CriterionScores'
        overallBand:
          type: number
          description: Server-authoritative overall band (IELTS half-rounding of the four criteria).
        comments:
          type: array
          items:
            $ref: '#/components/schemas/AnchoredComment'
        feedback:
          type: string
          nullable: true
        gradedBy:
          type: string
          format: uuid
          description: The teacher who authored this grade version.
        releasedAt:
          type: string
          format: date-time
          nullable: true
          description: When this version was released (null only for a future stored-but-unreleased grade — D1).
        createdAt:
          type: string
          format: date-time

    StudentGradeView:
      type: object
      # The student-facing grade (in /result — 5.5b renders it). EXCLUDES graded_by
      # teacher identity (privacy default — D1/Winston §7). gradedAt is the grade
      # row's created_at.
      required: [overallBand, criterionScores, comments, feedback, gradedAt]
      properties:
        overallBand:
          type: number
        criterionScores:
          $ref: '#/components/schemas/CriterionScores'
        comments:
          type: array
          items:
            $ref: '#/components/schemas/AnchoredComment'
        feedback:
          type: string
          nullable: true
        gradedAt:
          type: string
          format: date-time

    GradingStudent:
      type: object
      required: [id, fullName]
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string

    TeacherGradingView:
      type: object
      # The teacher grading read (AC8). submission carries FULL content (the essay);
      # exercise is the prompt (answer-stripped shape — writing has no answer key).
      # grade is the latest version or null when ungraded. aiSuggestion is the latest
      # COMPLETE ai_grade_writing suggestion or null (story 6.2a D2) — teacher-only,
      # class-shared (a co-teacher/admin sees it), absent from the student /result path.
      required: [submission, assignment, student, exercise, grade, aiSuggestion]
      properties:
        submission:
          $ref: '#/components/schemas/Submission'
        assignment:
          $ref: '#/components/schemas/StudentAssignmentView'
        student:
          $ref: '#/components/schemas/GradingStudent'
        exercise:
          $ref: '#/components/schemas/AttemptExercise'
        grade:
          description: The latest grade version, or null when ungraded.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/Grade'
        aiSuggestion:
          description: The latest COMPLETE ai_grade_writing suggestion for this submission, or null when none (story 6.2a D2). Rehydrates the 6.2b review UI on reopen.
          nullable: true
          allOf:
            - $ref: '#/components/schemas/AIWritingGradeResult'

    GradingQueueRow:
      type: object
      # One row of the teacher grading queue (AC17). released mirrors the D1 reader
      # contract (latest version released_at IS NOT NULL). overallBand is null when
      # ungraded. assignmentTitle/className are the queue's assignment + class (same
      # for every row).
      required: [submissionId, studentName, assignmentTitle, className, status, isOverdue, released, overallBand]
      properties:
        submissionId:
          type: string
          format: uuid
        studentName:
          type: string
        assignmentTitle:
          type: string
        className:
          type: string
        status:
          $ref: '#/components/schemas/SubmissionStatus'
        isOverdue:
          type: boolean
          description: The submission was late (submitted after the deadline).
        released:
          type: boolean
        overallBand:
          type: number
          nullable: true
          description: The current grade's overall band, or null when ungraded.

    EnvelopeGrade:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/Grade'
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'

    EnvelopeTeacherGradingView:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/TeacherGradingView'
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'

    EnvelopeGradingQueue:
      type: object
      required: [data, meta]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/GradingQueueRow'
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'

    AudioUrl:
      type: object
      # On-demand fresh presigned GET for the caller's own speaking recording
      # (story 5.5a AC10 play-intent refresh).
      required: [url]
      properties:
        url:
          type: string

    EnvelopeAudioUrl:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/AudioUrl'
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'

    # ---------------- Story 4.3a — AI content generation ----------------
    AIGenerateSectionParams:
      type: object
      required: [topic]
      properties:
        topic:
          type: string
          minLength: 1
          description: Free-text prompt seed for the section to generate.

    AIGenerateQuestionsParams:
      type: object
      required: [sectionId, count]
      properties:
        sectionId:
          type: string
          description: Target section (within the path exercise) to append question groups to.
        count:
          type: integer
          minimum: 1
          maximum: 20

    AIGenerateDistractorsParams:
      type: object
      required: [questionId, count]
      properties:
        questionId:
          type: string
          description: Target MCQ question (within the path exercise) to generate distractor options for.
        count:
          type: integer
          minimum: 1
          maximum: 20

    AIGenerateRequest:
      type: object
      required: [mode, params]
      properties:
        mode:
          type: string
          enum: [section, questions, distractors]
        params:
          description: >-
            Mode-specific parameters (typed by mode): section →
            AIGenerateSectionParams; questions → AIGenerateQuestionsParams;
            distractors → AIGenerateDistractorsParams. exerciseId is taken from the
            path; any client-supplied centerId is stripped and ignored (SEC-7 / R3
            — the job-row center_id is the sole trust anchor).
          oneOf:
            - $ref: '#/components/schemas/AIGenerateSectionParams'
            - $ref: '#/components/schemas/AIGenerateQuestionsParams'
            - $ref: '#/components/schemas/AIGenerateDistractorsParams'

    JobEnqueued:
      type: object
      required: [jobId]
      properties:
        jobId:
          type: string
          format: uuid

    EnvelopeJobEnqueued:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/JobEnqueued'
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'

    JobStatus:
      type: string
      enum: [pending, processing, complete, failed]

    AIGenerationResult:
      description: >-
        The AI generation result fragment produced once a job completes —
        content-shaped (the same structure as an exercise's content) so Story 4.3b
        can preview and insert it. Null on jobs.result until status=complete.
      allOf:
        - $ref: '#/components/schemas/ExerciseContent'

    # ---------------- Story 6.2a — AI Writing-grade suggestion ----------------
    AIWritingGradeCriterion:
      type: object
      # One IELTS Writing criterion's AI proposal: a band + rationale + confidence.
      # confidence is teacher-only (UX-DR22 — never shown to students); rationale +
      # confidence are NEVER persisted to grades (D3). All three keys required (a
      # missing/null band or confidence makes the whole result terminal
      # invalid_ai_response — the "complete ⇒ gradeable" seam invariant, D10).
      required: [band, rationale, confidence]
      properties:
        band:
          type: number
          description: Proposed criterion band (1.0–9.0, 0.5 grid — validated server-side, else terminal invalid_band_scores).
        rationale:
          type: string
          description: Short AI justification for the proposed band (teacher-only).
        confidence:
          type: string
          enum: [high, medium]
          description: AI confidence for this criterion — teacher-only, never shown to students (UX-DR22).

    AIWritingGradeCriteria:
      type: object
      # The four IELTS Writing criteria, each an AI proposal. Keys mirror
      # CriterionScores (grammaticalRange, NOT grammaticalRangeAccuracy — the shipped
      # 6.1 contract). All four required (a missing key ⇒ terminal invalid_ai_response).
      required: [taskResponse, coherenceCohesion, lexicalResource, grammaticalRange]
      properties:
        taskResponse:
          $ref: '#/components/schemas/AIWritingGradeCriterion'
        coherenceCohesion:
          $ref: '#/components/schemas/AIWritingGradeCriterion'
        lexicalResource:
          $ref: '#/components/schemas/AIWritingGradeCriterion'
        grammaticalRange:
          $ref: '#/components/schemas/AIWritingGradeCriterion'

    AnchoredAISuggestion:
      type: object
      # The 6.1 AnchoredComment shape (UTF-16 code-unit offsets into
      # submission.content.text; lowercase type; grammaticalRange criterion key) plus
      # an AI confidence. Out-of-range / surrogate-splitting anchors are demoted to
      # whole-essay (both null), never dropped (D5/D10). Structurally a superset of
      # AnchoredComment: 6.2b maps it into the grade form on accept, dropping confidence
      # (never persisted to grades — D3).
      required: [type, criterion, anchorStart, anchorEnd, text, confidence]
      properties:
        type:
          type: string
          enum: [error, praise, suggestion]
        criterion:
          type: string
          enum: [taskResponse, coherenceCohesion, lexicalResource, grammaticalRange]
        anchorStart:
          type: integer
          nullable: true
          description: UTF-16 code-unit start offset into content.text, or null for a whole-essay suggestion.
        anchorEnd:
          type: integer
          nullable: true
          description: UTF-16 code-unit end offset (exclusive), or null for a whole-essay suggestion.
        text:
          type: string
        confidence:
          type: string
          enum: [high, medium]
          description: AI confidence for this comment — teacher-only (UX-DR22).

    AIWritingGradeResult:
      type: object
      # The AI Writing-grade SUGGESTION produced once an ai_grade_writing job completes
      # (story 6.2a). Reviewable proposals — NOT a committed grade: the teacher reviews
      # in 6.2b and commits via POST /grade (D1). The worker does NOT compute an overall
      # band (6.2b previews it; 6.1 computes the authoritative one on commit). Anything
      # in jobs.result at status=complete is a fully-valid, gradeable suggestion (the
      # seam invariant, D10). No omitempty — overallFeedback is explicit null when absent
      # (GO-5).
      required: [criteria, comments, overallFeedback, analyzedWordCount, latencyMs]
      properties:
        criteria:
          $ref: '#/components/schemas/AIWritingGradeCriteria'
        comments:
          type: array
          items:
            $ref: '#/components/schemas/AnchoredAISuggestion'
        overallFeedback:
          type: string
          nullable: true
          description: Optional whole-essay AI feedback, or null.
        analyzedWordCount:
          type: integer
          description: Word count of the analysed essay (for the "analysed 287 words · 1.4s" UX line).
        latencyMs:
          type: integer
          description: Wall-clock the analysis took, in milliseconds (measured via the injected clock — deterministic in tests).

    Job:
      type: object
      required: [id, type, status, result, errorDetails, createdAt, startedAt, completedAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
        result:
          nullable: true
          description: >-
            The typed job result once complete; null until then. Discriminated by
            `type` (D11): ai_generate_* → AIGenerationResult (content-shaped, story
            4.3b); ai_grade_writing → AIWritingGradeResult (reviewable Writing-grade
            suggestion, story 6.2a). The two are structurally disjoint
            (AIGenerationResult has `sections`; AIWritingGradeResult has `criteria`), so
            a consumer narrows by job.type; an unknown type falls to a safe default.
          oneOf:
            - $ref: '#/components/schemas/AIGenerationResult'
            - $ref: '#/components/schemas/AIWritingGradeResult'
        errorDetails:
          type: string
          nullable: true
          description: >-
            On failure, a terminal detail code: invalid_ai_response,
            invalid_band_scores (ai_grade_writing — the AI proposed out-of-range
            or off-grid bands, distinct from unparseable output), stuck_timeout,
            max_retries_exhausted, generation_failed, or unknown_job_type.
        createdAt:
          type: string
          format: date-time
        startedAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true

    EnvelopeJob:
      type: object
      required: [data, meta]
      properties:
        data:
          $ref: '#/components/schemas/Job'
        meta:
          $ref: '#/components/schemas/EnvelopeMeta'

    # ---------------- Story 4.4a — Presigned uploads + Knowledge Hub ----------------
    UploadFeature:
      type: string
      enum: [knowledge, speaking, avatars, imports]
      description: The feature namespace segment of the R2 object key ({center_id}/{feature}/{uuid}.{ext}).

    PresignRequest:
      type: object
      required: [filename, contentType, feature, sizeBytes]
      properties:
        filename:
          type: string
          minLength: 1
          description: Original filename; its extension must be on the allowlist and match contentType.
        contentType:
          type: string
          description: MIME type — must be on the server allowlist and match the filename extension.
        feature:
          $ref: '#/components/schemas/UploadFeature'
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          description: Declared file size. Enforced against the per-feature A9 cap BEFORE the URL is generated (413 FILE_TOO_LARGE).

    PresignResult:
      type: object
      required: [url, key]
      properties:
        url:
          type: string
          description: The presigned PUT URL (short-lived, 5-min expiry). Never logged (A10 slog redaction).
        key:
          type: string
          description: The R2 object key the client must PUT to, then pass to /api/uploads/confirm.

    EnvelopePresignResult:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/PresignResult'

    ConfirmUploadRequest:
      type: object
      required: [key, sizeBytes]
      properties:
        key:
          type: string
          description: The R2 object key returned by /api/uploads/presign.
        name:
          type: string
          nullable: true
          description: Display name for the created file (knowledge feature). Defaults to the filename component of the key when absent.
        folderId:
          type: string
          format: uuid
          nullable: true
          description: Destination folder for the created file. null = root.
        sizeBytes:
          type: integer
          format: int64
          minimum: 1
          description: Client-declared size (advisory — confirm re-validates against HeadObject).

    File:
      type: object
      # All fields required + explicit (nulls not omitted) per GO-5.
      required:
        - id
        - centerId
        - folderId
        - name
        - slug
        - objectKey
        - contentType
        - sizeBytes
        - uploadedBy
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        centerId:
          type: string
          format: uuid
        folderId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        slug:
          type: string
          description: Unique-per-center URL-safe identifier for the file detail route.
        objectKey:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        uploadedBy:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LinkedLocation:
      type: object
      required: [type, id, label]
      properties:
        type:
          type: string
          enum: [session, exercise]
        id:
          type: string
          format: uuid
        label:
          type: string
          description: Human-readable label (session title / exercise title) for the linking host.

    FileDetail:
      type: object
      # File + linkedLocations. NO view-rate field (deferred to the analytics epic).
      required:
        - id
        - centerId
        - folderId
        - name
        - slug
        - objectKey
        - contentType
        - sizeBytes
        - uploadedBy
        - createdAt
        - updatedAt
        - linkedLocations
      properties:
        id:
          type: string
          format: uuid
        centerId:
          type: string
          format: uuid
        folderId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        slug:
          type: string
        objectKey:
          type: string
        contentType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        uploadedBy:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        linkedLocations:
          type: array
          items:
            $ref: '#/components/schemas/LinkedLocation'
          description: Sessions/exercises referencing this file. Excludes any whose host or the file itself is soft-deleted.

    Folder:
      type: object
      required:
        - id
        - centerId
        - parentFolderId
        - name
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        centerId:
          type: string
          format: uuid
        parentFolderId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    CreateFolderRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        parentFolderId:
          type: string
          format: uuid
          nullable: true
          description: Parent folder. null/absent = root-level.

    UpdateFolderRequest:
      type: object
      description: |
        Rename and/or move a folder. Tri-state on parentFolderId:
        key absent = unchanged; explicit null = move to root; a uuid = reparent.
        A move into the folder's own descendant is rejected 422 FOLDER_CYCLE.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        parentFolderId:
          type: string
          format: uuid
          nullable: true

    UpdateFileRequest:
      type: object
      description: |
        Rename and/or move a file. Tri-state on folderId: key absent = unchanged;
        explicit null = move to root; a uuid = reparent into that folder.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        folderId:
          type: string
          format: uuid
          nullable: true

    StorageUsage:
      type: object
      required: [usedBytes, limitBytes]
      properties:
        usedBytes:
          type: integer
          format: int64
          description: Sum of size_bytes over the center's live (deleted_at IS NULL) files.
        limitBytes:
          type: integer
          format: int64
          description: The center's storage ceiling (centers.storage_limit_bytes; 500 MiB free default).

    EnvelopeFile:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/File'

    EnvelopeFileList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/File'

    EnvelopeFileDetail:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/FileDetail'

    EnvelopeFolder:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/Folder'

    EnvelopeFolderList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Folder'

    EnvelopeStorageUsage:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/StorageUsage'

    DownloadUrl:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: Short-lived (5-min) presigned GET URL for the file's stored object. Never logged (A10 slog redaction).

    EnvelopeDownloadUrl:
      type: object
      required: [data]
      properties:
        data:
          $ref: '#/components/schemas/DownloadUrl'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
