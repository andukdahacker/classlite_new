  # ---------------- Story 4.4a — Presigned uploads + Knowledge Hub ----------------
  /api/uploads/presign:
    post:
      operationId: presignUpload
      summary: >-
        Presign a direct-to-R2 PUT (story 1.2e, hardened in 4.4a). Validates the
        MIME allowlist + extension↔Content-Type match server-side, locks the
        Content-Type into the signed payload, and enforces the per-feature A9
        size cap on `sizeBytes` (413 FILE_TOO_LARGE) BEFORE generating the URL.
        The 409 STORAGE_FULL here is an ADVISORY UX fast-fail only — the
        authoritative ceiling is enforced at /api/uploads/confirm (AC12).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PresignRequest'
      responses:
        "200":
          description: Presigned PUT URL + object key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopePresignResult'
        "401":
          description: AUTH_REQUIRED / AUTH_INVALID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: FORBIDDEN / EMAIL_VERIFICATION_REQUIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "409":
          description: STORAGE_FULL (advisory UX pre-check — NON-authoritative; confirm re-checks under a lock)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "413":
          description: FILE_TOO_LARGE (sizeBytes exceeds the per-feature A9 cap; message includes the cap in MB)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "422":
          description: Validation error (filename, contentType, feature, sizeBytes; disallowed MIME or extension↔type mismatch)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "429":
          description: RATE_LIMIT_EXCEEDED (Retry-After header)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/uploads/confirm:
    post:
      operationId: confirmUpload
      summary: >-
        Confirm a completed R2 upload (story 1.2e, hardened in 4.4a). Re-checks
        the {center_id} key prefix vs JWT tenant (403 R2_KEY_PREFIX_MISMATCH +
        audit), then HeadObject-re-validates the stored object's size + content
        type. For a `knowledge` key it creates the `files` row INSIDE a per-center
        serialized transaction that enforces the storage ceiling (409
        STORAGE_FULL) and is idempotent by (centerId, objectKey) — a retry
        returns the same file and never double-counts. On a size/type mismatch
        the object is best-effort deleted (413/422); a HeadObject transport
        failure fails closed (502, no row, no phantom delete).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmUploadRequest'
      responses:
        "200":
          description: Idempotent retry — the already-created file for this (centerId, objectKey)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeFile'
        "201":
          description: File record created for the confirmed knowledge upload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeFile'
        "401":
          description: AUTH_REQUIRED / AUTH_INVALID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "403":
          description: R2_KEY_PREFIX_MISMATCH (key prefix ≠ JWT tenant) / EMAIL_VERIFICATION_REQUIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "404":
          description: UPLOAD_NOT_FOUND (no stored object for the key)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "409":
          description: STORAGE_FULL (used + new exceeds the center storage ceiling — enforced under a per-center lock)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "413":
          description: FILE_TOO_LARGE (stored object exceeds the per-feature A9 cap; object best-effort deleted)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "422":
          description: CONTENT_TYPE_MISMATCH (stored Content-Type ≠ locked type; object best-effort deleted) / validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "502":
          description: UPLOAD_VERIFICATION_FAILED (HeadObject transport error — fail closed, no row, no delete)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "429":
          description: RATE_LIMIT_EXCEEDED (Retry-After header)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'

  /api/storage/usage:
    get:
      operationId: getStorageUsage
      summary: Current storage usage + ceiling for the caller's center (story 4.4a — AC12).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Used bytes (sum of live files) + the center storage ceiling
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnvelopeStorageUsage'
        "401":
          description: AUTH_REQUIRED / AUTH_INVALID
          content:
