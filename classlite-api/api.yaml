          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "409":
          description: >-
            SUBMISSION_NOT_WRITING (not a Writing exercise) / SUBMISSION_NOT_GRADABLE
            (not in submitted/graded status, or no essay content to grade) /
            AI_GRADE_ENQUEUE_CONFLICT (an in-flight AI grade for this submission
            changed state between the idempotency conflict and re-read — retry)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        "429":
          description: RATE_LIMIT_EXCEEDED (Retry-After — the AI rate limiter, ~20/min)
