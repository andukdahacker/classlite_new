# ClassLite screen manifest — Story 11-1a (AC4 / DD6/DD7/DD15/DD17).
#
# One entry per sNN screen-ID token (s00–s87 + the inserted s10a = 89 entries).
# This is the provenance RATCHET for the 88+1 screen vocabulary that 86 story
# files speak in. The CI s-ID lint (scripts/screens-lint.mjs) fails the build
# bidirectionally: any sNN token in the repo with no entry here, OR any entry
# here unreachable from a doc. It checks SHAPE / uniqueness / referential
# integrity + valid enums — NOT provenance correctness (DD8).
#
# provenance is a RATCHET, not a label (DD15): every entry currently reads
# `asserted-from-design-intent`. A later wave (11-3a/b reconciliation lint) must
# be able to FAIL if an entry reaches post-reconciliation still asserted without
# a dated exemption — the enum below is the structural hook for that gate.
#
# DD17 — source race: this manifest is derived from docs/classlite-entry/
# classlite-ia.md, which 11-3a ARCHIVES. 11-3a owns re-pointing `source` to the
# new docs/product/ chapter docs it creates when it archives. The lint keys on
# THIS manifest, not on classlite-ia.md's path, so an archive move never orphans it.

